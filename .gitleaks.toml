# GitReins — gitleaks configuration
# Auto-generated by 'gitreins init'. Edit to add project-specific exclusions.
# See: https://github.com/gitleaks/gitleaks#configuration

# Extend the default gitleaks ruleset so AWS/GitHub/GitLab/etc. patterns still run
[extend]
useDefault = true

# Catch all sk- prefixed API keys (OpenAI, OpenRouter, DeepSeek, etc.)
# 20+ chars — lower than gitleaks' default 32-char minimum
[[rules]]
id = "sk-api-key"
description = "OpenAI/OpenRouter/DeepSeek API key (sk- prefix)"
regex = '''(?i)sk-[a-zA-Z0-9_-]{20,}'''

# GitHub personal access tokens — gitleaks' default rules missed
# ghp_... PATs in the 2026-08-14 dogfood (DF-012)
[[rules]]
id = "gitreins-github-pat"
description = "GitHub personal access token (ghp_ prefix)"
regex = '''\bghp_[A-Za-z0-9]{36,}'''

# GitLab personal access tokens
[[rules]]
id = "gitreins-gitlab-pat"
description = "GitLab personal access token (glpat- prefix)"
regex = '''\bglpat-[A-Za-z0-9_\-]{20,}'''

# GCP API keys
[[rules]]
id = "gitreins-gcp-api-key"
description = "GCP API key (AIza prefix)"
regex = '''\bAIza[0-9A-Za-z\_-]{35,}'''

# CF-383: tier-1 ("secrets") grades the WORKING TREE — `gitleaks detect --no-git` — not the
# index, so it also reads files git can never commit, generated bytecode included. On 2026-11-07
# that produced this finding, the only one in the tree:
#   RuleID: private-key   File: tests/__pycache__/test_node_provisioning.cpython-314.pyc:35
# The bytes it matched are the SYNTHETIC PEM fixture tests/test_node_provisioning.py writes to
# prove a 0644 deploy key is refused — there is no real secret. `__pycache__/` and `*.pyc` are
# gitignored, and the commit guard scans staged files only, so excluding bytecode here cannot
# hide a key that is committable; without the exclusion the guard said clean and the judge said
# FAIL on the same tree, which is how verdict c46e82aa failed CF-003 with lint/tests/tier-2 PASS.
[allowlist]
description = "Auto-generated by gitreins init — skip dependency dirs, docs, specs"

paths = [
  '''\.git/''',
  '''\.gitreins/''',
  '''\.gitreins/history/''',
  '''.*\.log''',
  '''specs/''',
  '''docs/''',
  '''.*\.spec\.md''',
  '''.*\.md''',
  # Generated bytecode (CF-383) — gitignored, so it can never be committed.
  '''__pycache__/''',
  '''\.pyc$''',
]

