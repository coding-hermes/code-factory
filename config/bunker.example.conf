# bunker.example.conf — copy to ~/.config/code-factory/<project>.conf and edit.
# One project, one bunker. KEY=VALUE only; comments with '#'. No secrets in this file:
# it names the token files the provisioner reads into a single 600 bundle and deletes.
# The command line always wins over this file.
# REPO must be an HTTPS URL: the provisioning bundle installs an HTTPS credential store
# (~/.git-credentials). An SSH remote needs a key, which this provisioner does not install.

PROJECT=code-factory
AGENT=<agent-id>
SERVER=<bunker-server>
REPO=https://github.com/coding-hermes/code-factory.git
REF=main
HARNESS=hermes
NAMESPACE=code-factory
TTL=30d

# token files on the CONTROL host (mode 600); never the values
GITHUB_TOKEN_FILE=~/.config/code-factory/github.token
DUCKBRAIN_TOKEN_FILE=~/.duckbrain/9router-foreman.token
S3_ENV_FILE=~/.config/code-factory/s3.env

# the two services a node must be able to reach
CRIER_URL=http://<control-host>:8767
DUCKBRAIN_URL=http://<control-host>:3000

# the node's declared environment: a profile (ENV_<NAME>=<value> or @<path>) applied on the
# node, and one CONFIG_SET_* key per scalar in ~/.hermes/config.yaml. Only these five exist.
# See config/node.env.example.
# NODE_ENV_FILE=~/.config/code-factory/code-factory.node.env
# CONFIG_SET_MODEL_PROVIDER=cf-proxy
# CONFIG_SET_MODEL_NAME=<model-id>
# CONFIG_SET_GATEWAY_BIND=0.0.0.0
# CONFIG_SET_GATEWAY_PORT=10800
# CONFIG_SET_AGENT_MAX_ITERATIONS=40
