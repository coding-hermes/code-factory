<text x="24.0" y="370.0" font-size="8.40" fill="#000000" text-anchor="start">FLOWS THIS MODULE PARTICIPATES IN</text>
<text x="24.0" y="392.0" font-size="9.50" fill="#000000" text-anchor="start">F1 DISPATCH — How does a board row become work?</text>
<text x="24.0" y="432.0" font-size="9.50" fill="#000000" text-anchor="start">F2 PROVISIONING — How does a bare host become a node?</text>
<text x="24.0" y="472.0" font-size="9.50" fill="#000000" text-anchor="start">F3 MEMORY — How does a run become searchable?</text>
<text x="24.0" y="512.0" font-size="9.50" fill="#000000" text-anchor="start">F5 LANDING — How does work reach main?</text>
<text x="24.0" y="552.0" font-size="9.50" fill="#000000" text-anchor="start">F6 MAINTENANCE — What keeps disks, branches, caches and freshness honest?</text>
<text x="24.0" y="592.0" font-size="9.50" fill="#000000" text-anchor="start">F8 RECOVERY — What happens after a crash, restart or orphaned run?</text>
<text x="24.0" y="632.0" font-size="9.50" fill="#000000" text-anchor="start">F9 DEGRADATION — A dependency is gone — what does the system do?</text>
<text x="24.0" y="672.0" font-size="9.50" fill="#000000" text-anchor="start">F10 TEARDOWN / REBUILD — How is a node or lane removed without residue?</text>
<text x="24.0" y="712.0" font-size="9.50" fill="#000000" text-anchor="start">F12 CREDENTIAL LIFECYCLE — How does a credential stay fresh, scoped and out of</text>
<text x="36.0" y="724.0" font-size="9.50" fill="#000000" text-anchor="start">argv?</text>
<text x="24.0" y="752.0" font-size="9.50" fill="#000000" text-anchor="start">F14 OBSERVABILITY INGESTION — Where does a tick, turn or message become a</text>
<text x="36.0" y="764.0" font-size="9.50" fill="#000000" text-anchor="start">visible, attributed line?</text>
