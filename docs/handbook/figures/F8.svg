<text x="10.0" y="87.0" font-size="9.50" font-weight="400" fill="#888888" text-anchor="start">1</text>
<path d="M87,82 h22 v26 h-22" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="119.0" y="76.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">redelivery replays the recorded result</text>
<text x="119.0" y="89.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">instead of re-running (M11 §3 S2)</text>
<text x="10.0" y="133.0" font-size="9.50" font-weight="400" fill="#888888" text-anchor="start">2</text>
<line x1="165.0" y1="130.0" x2="235.0" y2="130.0" stroke="#111111" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="300.0" y="122.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">an unacked message redelivers after lease expiry; an</text>
<text x="300.0" y="135.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">empty list is not a lost message (M10 §11)</text>
<text x="10.0" y="179.0" font-size="9.50" font-weight="400" fill="#888888" text-anchor="start">3</text>
<line x1="305.0" y1="176.0" x2="375.0" y2="176.0" stroke="#111111" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="370.0" y="168.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">--reap-sessions closes stale sessions; dry-run</text>
<text x="370.0" y="181.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">without --apply (M9 §5)</text>
<text x="10.0" y="225.0" font-size="9.50" font-weight="400" fill="#888888" text-anchor="start">4</text>
<line x1="445.0" y1="222.0" x2="515.0" y2="222.0" stroke="#111111" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="370.0" y="214.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">board_read resolves the board from origin/main when</text>
<text x="370.0" y="227.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="start">the working copy drifts (M4 §3)</text>
<text x="10.0" y="271.0" font-size="9.50" font-weight="400" fill="#888888" text-anchor="start">5</text>
<line x1="585.0" y1="268.0" x2="445.0" y2="268.0" stroke="#111111" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="515.0" y="260.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="middle">board_lock ERROR verdict — lock state unknown: stop</text>
<text x="515.0" y="273.0" font-size="9.50" font-weight="400" fill="#14532d" text-anchor="middle">and diagnose, never write (M4 §3)</text></svg>