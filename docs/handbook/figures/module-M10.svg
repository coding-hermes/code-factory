<text x="24.0" y="314.0" font-size="8.40" fill="#000000" text-anchor="start">FLOWS THIS MODULE PARTICIPATES IN</text>
<text x="24.0" y="336.0" font-size="9.50" fill="#000000" text-anchor="start">F1 DISPATCH — How does a board row become work?</text>
<text x="24.0" y="376.0" font-size="9.50" fill="#000000" text-anchor="start">F7 MONITORING — How does anyone learn the machine is unwell?</text>
<text x="24.0" y="416.0" font-size="9.50" fill="#000000" text-anchor="start">F8 RECOVERY — What happens after a crash, restart or orphaned run?</text>
<text x="24.0" y="456.0" font-size="9.50" fill="#000000" text-anchor="start">F9 DEGRADATION — A dependency is gone — what does the system do?</text>
<text x="24.0" y="496.0" font-size="9.50" fill="#000000" text-anchor="start">F11 SCHEDULING ADMISSION — Does a lane&#x27;s tick get admitted, and why not?</text>
<text x="24.0" y="536.0" font-size="9.50" fill="#000000" text-anchor="start">F16 MULTI-NODE FAN-OUT — How does one directive reach several nodes, each with</text>
<text x="36.0" y="548.0" font-size="9.50" fill="#000000" text-anchor="start">its own receipt?</text>
