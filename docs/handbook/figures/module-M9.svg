<text x="30.0" y="270.0" font-size="9.50" font-weight="400" fill="#555555" text-anchor="start">load</text>
<line x1="230.0" y1="309.0" x2="263.0" y2="224.7" stroke="#14532d" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="20.0" y="284.0" width="210.0" height="50.0" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
