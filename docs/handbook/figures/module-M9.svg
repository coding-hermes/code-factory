<svg xmlns="http://www.w3.org/2000/svg" width="243.5mm" height="243.5mm" viewBox="0 0 680 974.0" preserveAspectRatio="xMidYMid meet"><rect width="680" height="974.0" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><text x="24.0" y="38.0" font-size="17.00" font-weight="700" fill="#111111" text-anchor="start">M9 — SCHEDULER</text>
<text x="24.0" y="60.0" font-size="9.50" font-weight="400" fill="#555555" text-anchor="start">the control plane&#x27;s clock and admission authority (M9 §2)</text>
