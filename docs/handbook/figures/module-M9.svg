<text x="460.0" y="244.0" font-size="8.40" fill="#000000" text-anchor="start">CT-15 · M9 -&gt; DUCKBRAIN  [UNVERIFIED]</text>
<text x="460.0" y="258.0" font-size="8.40" fill="#000000" text-anchor="start">decisions, findings, goal</text>
<text x="24.0" y="370.0" font-size="8.40" fill="#000000" text-anchor="start">FLOWS THIS MODULE PARTICIPATES IN</text>
<text x="24.0" y="392.0" font-size="9.50" fill="#000000" text-anchor="start">F1 DISPATCH — How does a board row become work?</text>
<text x="24.0" y="432.0" font-size="9.50" fill="#000000" text-anchor="start">F2 PROVISIONING — How does a bare host become a node?</text>
<text x="24.0" y="472.0" font-size="9.50" fill="#000000" text-anchor="start">F7 MONITORING — How does anyone learn the machine is unwell?</text>
<text x="24.0" y="512.0" font-size="9.50" fill="#000000" text-anchor="start">F8 RECOVERY — What happens after a crash, restart or orphaned run?</text>
<text x="24.0" y="552.0" font-size="9.50" fill="#000000" text-anchor="start">F9 DEGRADATION — A dependency is gone — what does the system do?</text>
<text x="24.0" y="592.0" font-size="9.50" fill="#000000" text-anchor="start">F11 SCHEDULING ADMISSION — Does a lane&#x27;s tick get admitted, and why not?</text>
<text x="24.0" y="632.0" font-size="9.50" fill="#000000" text-anchor="start">F13 UPGRADE AND MIGRATION — How does a pinned bump or schema change reach the</text>
<text x="36.0" y="644.0" font-size="9.50" fill="#000000" text-anchor="start">running system?</text>
<text x="24.0" y="672.0" font-size="9.50" fill="#000000" text-anchor="start">F14 OBSERVABILITY INGESTION — Where does a tick, turn or message become a</text>
<text x="36.0" y="684.0" font-size="9.50" fill="#000000" text-anchor="start">visible, attributed line?</text>
<text x="24.0" y="712.0" font-size="9.50" fill="#000000" text-anchor="start">F15 BACKUP AND RESTORE — Can an artifact be restored and proven?</text>
<text x="24.0" y="752.0" font-size="9.50" fill="#000000" text-anchor="start">F16 MULTI-NODE FAN-OUT — How does one directive reach several nodes, each with</text>
<text x="36.0" y="764.0" font-size="9.50" fill="#000000" text-anchor="start">its own receipt?</text>
