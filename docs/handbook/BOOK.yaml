figures:
  # Part 0 — Overview (the three whole-system views).
  # Codes are QUOTED strings on purpose: unquoted `2.10` is a YAML float and parses
  # to 2.1, which collided with F1's code and printed F10's figure as "FIGURE 2.1"
  # (and Module M10 as "3.1"). A code is an identifier, never a number.
  - {code: "0.1", file: figures/system-map.svg, caption: "System map — 33 components, 6 layers, 16 flows, 31 typed contracts; five host/trust enclosures; edges keyed CT-01…CT-30 plus CT-06R; model f73bd68a… 3f81a2."}
  - {code: "0.2", file: figures/board-lifecycle.svg, caption: "Board row lifecycle — the open→claim→integrate→close path plus the exits that are not forward (refused, superseded, blocked), each exit naming who may take it."}
  - {code: "0.3", file: figures/tick-lifecycle.svg, caption: "Scheduler tick lifecycle — admission, spawn, execution, settlement and the abandoned-tick path, with the readback that decides each transition."}
  # Part III — per-module centered views, one per module chapter, mounted as its hero
  # figure sheet before the chapter text (code = part prefix 3 + module number).
  - {code: "3.0", file: figures/module-M0.svg, caption: "M0 shared contract — the canonical record shapes, digest domains and vocabulary every other module builds on; nothing downstream may redefine them."}
  - {code: "3.1", file: figures/module-M1.svg, caption: "M1 provisioning — host qualification from disk floor and toolchain floor to the node that can receive a command before it is given a repository."}
  - {code: "3.2", file: figures/module-M2.svg, caption: "M2 dispatch — the envelope from scheduler admission through the transport to the node, and the return path that carries evidence, not a version string."}
  - {code: "3.3", file: figures/module-M3.svg, caption: "M3 repository — the branch, worktree and commit path, with the ancestry proof that makes a claimed landing checkable on the control host."}
  - {code: "3.4", file: figures/module-M4.svg, caption: "M4 board — the append-only JSONL ledger, its row vocabulary, and the claim/close discipline that keeps status a measurement rather than an assertion."}
  - {code: "3.5", file: figures/module-M5.svg, caption: "M5 harness — the editor loop inside a node: read, edit, build, test, and the gate that decides whether the result may be committed."}
  - {code: "3.6", file: figures/module-M6.svg, caption: "M6 documentation — intent to issue: outline, draft, lint, figure and contract reconciliation, rendered readback, and the receipt that binds the delivered bytes."}
  - {code: "3.7", file: figures/module-M7.svg, caption: "M7 github — remote identity, credential scope and the push/PR boundary, including the checks that must pass before a branch is offered upstream."}
  - {code: "3.8", file: figures/module-M8.svg, caption: "M8 safety — the refusal surface: what the factory will not do without owner authority, and the refusals that are structural rather than advisory."}
  - {code: "3.9", file: figures/module-M9.svg, caption: "M9 scheduler — lanes, weight budget and admission: how a tick earns compute, and the state that is durable across a restart."}
  - {code: "3.10", file: figures/module-M10.svg, caption: "M10 crier — the message bus: envelope guard, custody, delivery, replay and settlement, with the identity that makes redelivery safe."}
  - {code: "3.11", file: figures/module-M11.svg, caption: "M11 dispatcher — per-target dispatch and the serial loop that bounds fan-out, including the head-of-line case the register records as implementation evidence."}
  - {code: "3.12", file: figures/module-M12.svg, caption: "M12 inference proxy — provider routing, fallback chain ordering and usage capture, and where the boundary with the control-host session endpoint lies."}
  - {code: "3.13", file: figures/module-M13.svg, caption: "M13 chat gateways — the bunker-side chat identity and its token-by-reference config envelope (CT-31, spec-derived): per-bunker tokens, scheduler routing independent of chat delivery, and a dead token failing fast instead of stalling a lane."}
  # Part II — per-flow diagrams F1…F16, drawn from the reconciled contracts.
  - {code: "2.1", file: figures/F1.svg, caption: "F1 dispatch and settlement — one foreman round end to end: refresh and eligibility, claim, dispatch, node execution, evidence return, verification and settlement, every step citing its chapter or contract."}
  - {code: "2.2", file: figures/F2.svg, caption: "F2 provisioning — a declared host and project becoming a node that can receive a command, with the qualification and readback that must pass before a repository is attached."}
  - {code: "2.3", file: figures/F3.svg, caption: "F3 memory — the project namespace from the foreman's read through the local journal to the pending-sync state that survives a restart."}
  - {code: "2.4", file: figures/F4.svg, caption: "F4 documentation — approved intent, versioned draft, the review corrections, and the rendered readback that decides whether the artifact is accepted."}
  - {code: "2.5", file: figures/F5.svg, caption: "F5 landing — the worker branch through staging, integration by configured policy, and the ancestry and tree checks that bind the landing to a commit."}
  - {code: "2.6", file: figures/F6.svg, caption: "F6 maintenance — eligibility, reclamation and the measured result: bytes reclaimed or an explicit refusal with its reason."}
  - {code: "2.7", file: figures/F7.svg, caption: "F7 monitoring — a factory event delivered to a receiver, interpreted, paged and repaired, with independently read-back readiness."}
  - {code: "2.8", file: figures/F8.svg, caption: "F8 recovery — resume after a process, service or lock failure, converge state and readiness, then retry; automatic repair stays inside configured authority."}
  - {code: "2.9", file: figures/F9.svg, caption: "F9 degradation — what remains permitted when a dependency is down, and the branch back: admission re-evaluated and the mode cleared."}
  - {code: "2.10", file: figures/F10.svg, caption: "F10 teardown and rebuild — stop, remove, rebuild from an explicitly selected deployment, with retained or lost evidence reported at the end."}
  - {code: "2.11", file: figures/F11.svg, caption: "F11 scheduling admission — current configuration, eligibility and turn order, and the branch that re-enables admission after a cooldown."}
  - {code: "2.12", file: figures/F12.svg, caption: "F12 credential lifecycle — issue, distribute, rotate and revoke, with the replacement installed before the old authority is denied."}
  - {code: "2.13", file: figures/F13.svg, caption: "F13 upgrade and migration — qualification, drain and fence, stage, verified backup, migration and switch, postchecks, and the allowed rollback or forward-repair branches."}
  - {code: "2.14", file: figures/F14.svg, caption: "F14 observability ingestion — turn, model, token and cost telemetry into the session sink, with provenance kept distinct from memory synchronization."}
  - {code: "2.15", file: figures/F15.svg, caption: "F15 backup and restore — scope and trigger, per-store snapshots into a scratch home, and the readback that proves the restore before any resume."}
  - {code: "2.16", file: figures/F16.svg, caption: "F16 multi-node fan-out — per-target dispatch to each registry agent, custody and replay identity, reply before ack, and settlement per dispatch."}

rules:
  - "One id resolves to exactly one object across the set; ids are never reused."
  - "A chapter that measures a contract state different from Part IV amends the register row in the same commit."
  - "The contents table is generated from this file; a file present on disk and absent here is a build error."
  - "A part with no files renders as one page naming what is missing — never silently skipped."
