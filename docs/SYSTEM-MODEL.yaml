flows:
- id: F1
  name: DISPATCH
  question: How does a board row become settled, published work?
  steps:
  - - scheduler
    - board
    - Refresh before eligibility; WORK / NO-WORK / UNREADABLE (F11)
  - - scheduler
    - manager
    - Read active binding; reserve total allowance; get one-use launch grant
  - - scheduler
    - crier
    - Persist/send round-admission.v1 with fixed task_scope and budget (CT-02)
  - - crier
    - foreman
    - Durable custody/lease; validate live fence; launch resident foreman (CT-03)
  - - foreman
    - duckbrain
    - Recall same project namespace; local keyed reads supported (F3)
  - - foreman
    - board
    - 'Wave loop: refresh, select authorized newly eligible tasks, CAS claims'
  - - foreman
    - harness
    - Reserve remaining budget; worker-brief.v1; fixed Hermes in Bunker (CT-05)
  - - harness
    - gitreins
    - Guard exact candidate; independent acceptance remains separate
  - - foreman
    - broker
    - Exact-tree integrated gates, destination CAS and remote proof (F5)
  - - foreman
    - board
    - Evidence-bound task closeout via broker CAS
  - - foreman
    - duckbrain
    - Commit each worker and wave record; pending sync retained
  - - foreman
    - manager
    - Publish budget/wave progress; repeat while useful authorized work and remaining budget
  - - foreman
    - duckbrain
    - Distinct final-round summary; fsynced local commit (F3)
  - - foreman
    - crier
    - Return correlated round-report.v1 (CT-06R)
  - - crier
    - scheduler
    - Received -> awaiting_evidence; read controller memory/evidence custody
  - - scheduler
    - board
    - Required postchecks; failure blocks final acceptance
  - - scheduler
    - scheduler
    - Final settlement revision and once-only follow-up; no budget reset
  legacy_steps:
  - - scheduler
    - board
    - refresh local + remote repo/board copies BEFORE eligibility
  - - scheduler
    - board
    - 'board-check verifier hook: WORK / NO-WORK / UNREADABLE'
  - - scheduler
    - scheduler
    - no-work → cooldown/defer; unreadable → diagnose, never dispatch
  - - scheduler
    - scheduler
    - 'admission (F11); GAP: today''s PRE hook runs AFTER admission'
  - - scheduler
    - crier
    - 'envelope: run_id, corr_id, lane, board, text_b64 (CT-02)'
  - - crier
    - node
    - inbox pull + lease (CT-03) — launch into the Bunker
  - - node
    - foreman
    - 'foreman/worker start: brief + workspace in the Bunker'
  - - foreman
    - harness
    - 'MVP: the foreman invokes the fixed Hermes harness directly'
  - - node
    - router
    - 'FUTURE: Task Router between Node and Harness — NOT PART OF MVP'
  - - harness
    - foreman
    - diff + evidence returned
  - - foreman
    - foreman
    - commit guard (Tier 1), then acceptance judgment (Tier 2)
  - - foreman
    - duckbrain
    - memory write — Bunker DuckBrain, shared controller view (CT-15)
  - - foreman
    - board
    - 'integration/publication: results + board changes (CT-14)'
  - - foreman
    - crier
    - foreman response — the durable return leg through Crier (CT-06R)
  - - crier
    - scheduler
    - scheduler records completion, triggers follow-up (CT-06)
  - - scheduler
    - scheduler
    - POST hook runs AFTER outcome — cannot change the tick
  - - scheduler
    - board
    - 'end-of-lane sync: reconcile board copies; evidence bound'
  legacy_note: refresh-before-eligibility and the end verifier are the approved target; existing PRE/POST hook phases sit after admission and after outcome recording — that integration gap is shown, not concealed
  target_revision: CF2A-01/P5-A
  normative_source: Part II F1; Part I 1.9
- id: F2
  name: PROVISIONING
  question: How does a bare host become a node?
  steps:
  - - owner
    - provisioner
    - 'F2.0: verified release/trust bundle; user-space prerequisite checks'
  - - provisioner
    - authority
    - Enroll first admin; consume nonce; establish independent authority
  - - provisioner
    - manager
    - Start empty journal/broker; authenticated generation-zero read
  - - owner
    - manager
    - CAS zero -> one global config; projects empty during bootstrap only
  - - manager
    - crier
    - Install/probe durable custody before workspaces
  - - manager
    - duckbrain
    - Controller namespace service; proxy/scheduler disabled-readiness probes
  - - owner
    - manager
    - New generation adds project/lane/profile/credentials
  - - manager
    - bunker
    - Fresh resource vectors; deterministic placement/reservation (CT-27)
  - - provisioner
    - node
    - Pinned runtime, embedded board, namespace, credentials and volumes
  - - verifier
    - node
    - Authenticated application/resource/memory/repository restart probes
  - - manager
    - crier
    - Prepare non-routable candidate binding
  - - manager
    - scheduler
    - Prepare candidate; commit active pointer; read back both; enable grants
  legacy_steps:
  - - owner
    - scheduler
    - 'lane declared: project, harness, pin'
  - - provisioner
    - bunker
    - container created, home, keys (M1 §3 S2)
  - - provisioner
    - node
    - 'layers: base, harness, bus, repo (M1 §3)'
  - - provisioner
    - node
    - DuckBrain installed in every Bunker — same logical memory view as the controller (resolved decision 2)
  - - node
    - duckbrain
    - identity + namespace credential
  - - verifier
    - node
    - verify-node measures the result — CREATED ≠ VERIFIED (M1 §12)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F2; Part I 1.9
- id: F3
  name: MEMORY
  question: How does a run become searchable?
  steps:
  - - foreman
    - duckbrain
    - Resolve explicit namespace; recall before brief
  - - foreman
    - duckbrain
    - Worker -> wave -> round records, immutable record IDs/digests
  - - duckbrain
    - foreman
    - Fsync Git objects/ref and read back; local_commit is acknowledgement
  - - duckbrain
    - broker
    - Exchange pending commits; validate namespace/writer/fence; no overwrite conflicts
  - - broker
    - duckbrain
    - Controller readback records sync_commit/freshness; release pending hold
  - - scheduler
    - duckbrain
    - Missing controller evidence keeps awaiting_evidence, not settled success
  legacy_steps:
  - - node
    - duckbrain
    - R1 detail record (CT-09, missing)
  - - node
    - duckbrain
    - R2 fleet index record (CT-09, missing)
  - - foreman
    - duckbrain
    - R3 weekly rollup (CT-15)
  - - owner
    - duckbrain
    - recall by project, week, lane
  target_revision: CF2A-01/P5-A
  normative_source: Part II F3; Part I 1.9
- id: F4
  name: DOCUMENTATION
  question: How does a component become an approved document?
  steps:
  - - foreman
    - docsgate
    - skeleton + source
  - - foreman
    - docsgate
    - seat fills, cites file:line
  - - docsgate
    - foreman
    - PASS or named refusals (CT-16)
  - - panel
    - foreman
    - 3 seats grade independently; splits reported, never voted away (M6 §3 S4)
  - - spine
    - handbook
    - 'cross-chapter consistency: CT ids, states, dangling refs (M6 §3 S9)'
  - - handbook
    - owner
    - PDF with status per module (CT-18)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F4; Part I 1.9
- id: F5
  name: LANDING
  question: How does work reach main?
  steps:
  - - node
    - gitreins
    - Candidate exact-tree commit guard (CT-12)
  - - gitreins
    - foreman
    - Independent acceptance evidence bound to candidate/criteria (CT-13)
  - - foreman
    - broker
    - Mode-specific integration at remote base; all required tree gates
  - - broker
    - github_provider
    - Destination ref CAS; native GitHub publication when selected
  - - broker
    - gitlab_provider
    - Destination ref CAS; native GitLab publication when selected
  - - foreman
    - board
    - Remote accepted-tree/ancestry mapping readback, evidence-bound closeout
  legacy_steps:
  - - node
    - gitreins
    - commit on a node branch; the gate grades the staged diff (CT-12)
  - - gitreins
    - foreman
    - verdict returned to the foreman (CT-13)
  - - owner
    - lander
    - lander merges the branch and proves ancestry on origin/main (M3 §2)
  - - foreman
    - board
    - row closed with evidence (CT-14)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F5; Part I 1.9
- id: F6
  name: MAINTENANCE
  question: What keeps disks, branches, caches and freshness honest?
  steps:
  - - safety
    - manager
    - Inventory resources and retention/owner/sync/backup holds
  - - manager
    - manager
    - CAS live -> deleting only with all eligibility facts
  - - safety
    - node
    - Lock inode/path, quarantine/fsync/delete; new holds refused
  - - safety
    - manager
    - Measured reclaimed bytes and retained/refused reasons
  legacy_steps:
  - - provisioner
    - safety
    - layer 00 — reclaim_disk reaps build caches and job dirs past the 24 h TTL (M8 §3 S1)
  - - provisioner
    - safety
    - node_hygiene reap removes orphan homes/keys after a 60-minute grace (M1 §5)
  - - node
    - node
    - repo_freshness measures how far a workdir lags origin (M3 §5)
  - - verifier
    - node
    - node_freshness measures branch/HEAD/lag on the node (M1 §11)
  - - safety
    - node
    - 'protected paths refused before inspection: repo, node.json, crier.json (M8 §5)'
  target_revision: CF2A-01/P5-A
  normative_source: Part II F6; Part I 1.9
- id: F7
  name: MONITORING
  question: How does anyone learn the machine is unwell?
  steps:
  - - owner
    - manager
    - Authenticated scoped progress/readiness/metrics query
  - - manager
    - foreman
    - Latest progress sequence/heartbeat; age >30 seconds is stale
  - - manager
    - owner
    - Allowance/consumed/reserved/remaining, wave state, stop reason; unknown not zero
  - - scheduler
    - owner
    - Settlement/admission series, separate from proxy usage JSONL
  - - manager
    - manager
    - Authorized reconciliation; independently re-probe readiness
  legacy_steps:
  - - scheduler
    - owner
    - GET /api/v1/metrics — spawns, deferrals, ticks, tick duration (M9 §8)
  - - scheduler
    - owner
    - /api/v1/status — per-project failure-rate breakdown (M9 §5)
  - - crier
    - owner
    - /metrics, default-ON — guard and inbox series (M10 §8)
  - - proxy
    - owner
    - 'usage JSONL per request: node, model, status, bytes (M12 §8)'
  legacy_note: 11 of 13 modules emit no metrics — answerable only by grepping logs; the largest remaining system defect
  target_revision: CF2A-01/P5-A
  normative_source: Part II F7; Part I 1.9
- id: F8
  name: RECOVERY
  question: What happens after a crash, restart or orphaned run?
  steps:
  - - manager
    - manager
    - Persist incident and unknown owner/effect state
  - - manager
    - crier
    - 'F8.1 control: close grants, request drain/pause/cancel'
  - - crier
    - dispatcher
    - Checkpoint then grace/TERM/KILL owned cgroup; receipt is not mere custody
  - - manager
    - authority
    - Advance fence only after unresolved mutations are reconciled/denied
  - - dispatcher
    - manager
    - Checkpoint/budget/claims readback or fenced_unknown
  - - manager
    - broker
    - Discover published effects; never blind retry
  - - manager
    - provisioner
    - F2 replacement on eligible host; restore committed state
  - - manager
    - scheduler
    - Fenced binding prepare/commit/readback before resume
  - - manager
    - foreman
    - Same round identities/budget; new attempt for stopped execution
  legacy_steps:
  - - dispatcher
    - dispatcher
    - redelivery replays the recorded result instead of re-running (M11 §3 S2)
  - - crier
    - node
    - an unacked message redelivers after lease expiry; an empty list is not a lost message (M10 §11)
  - - scheduler
    - sessionstore
    - --reap-sessions closes stale sessions; dry-run without --apply (M9 §5)
  - - board
    - foreman
    - board_read resolves the board from origin/main when the working copy drifts (M4 §3)
  - - owner
    - board
    - 'board_lock ERROR verdict — lock state unknown: stop and diagnose, never write (M4 §3)'
  target_revision: CF2A-01/P5-A
  normative_source: Part II F8; Part I 1.9
- id: F9
  name: DEGRADATION
  question: A dependency is gone — what does the system do?
  steps:
  - - scheduler
    - manager
    - Dependency failure -> named admission deferral, no execution fallback
  - - guard
    - crier
    - Classifier outage/invalid verdict -> refusal before custody; fail-closed
  - - proxy
    - node
    - Missing/expired/revoked access refuses upstream work
  - - foreman
    - duckbrain
    - HTTP outage permits local committed memory; pending sync retained
  - - gitreins
    - foreman
    - Unavailable required gate forbids accepted publication
  legacy_steps:
  - - gateway
    - scheduler
    - 'gateway fails: the tick is deferred, not exec-spawned (no-exec-fallback=true) (M9 §5)'
  - - scheduler
    - node
    - 'load gate: new spawns deferred while load ≥ threshold (M9 §3)'
  - - guard
    - node
    - 'guard provider outage: fail-open unless the policy is FailClosed (M10 §10)'
  - - proxy
    - node
    - 'proxy fails closed at startup: no token file or no upstream key → exit 2 (M12 §11)'
  - - gitreins
    - node
    - 'gate absent: the pre-commit hook exits 0 — a silent bypass that must be disclosed (M3 §10)'
  target_revision: CF2A-01/P5-A
  normative_source: Part II F9; Part I 1.9
- id: F10
  name: TEARDOWN / REBUILD
  question: How is a node or lane removed without residue?
  steps:
  - - owner
    - manager
    - Authorized target removal/rebuild; close new assignments
  - - manager
    - dispatcher
    - F8.1 drain/checkpoint or fence; preserve evidence/memory
  - - manager
    - authority
    - Revoke old capability/identity; prove denial
  - - manager
    - provisioner
    - Destroy only retention-eligible quiescent resources
  - - provisioner
    - node
    - F2 restore/rebuild and verifier probes
  - - manager
    - scheduler
    - New verified binding; retained lifecycle receipt
  legacy_steps:
  - - owner
    - provisioner
    - --destroy requires --yes and a named agent (M1 §5)
  - - provisioner
    - bunker
    - container and per-agent home removed on the server (M1 §5)
  - - provisioner
    - safety
    - orphan homes/keys reaped against a live-registry check (M1 §10)
  - - provisioner
    - node
    - rebuild — the seed reapplies from the manifest, drift named per file (M1 §3 S4)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F10; Part I 1.9
- id: F11
  name: SCHEDULING ADMISSION
  question: Does a lane's tick get admitted, and why not?
  steps:
  - - scheduler
    - board
    - repo/board refresh BEFORE eligibility; the checked revision is recorded (approved target; see F1 gap note)
  - - scheduler
    - scheduler
    - cadence tick fires; admission mode — project override → namespace → cooldown (M9 §3)
  - - scheduler
    - board
    - board ownership and workability decide the tasks waiver — WORK, NO-WORK and UNREADABLE are distinct outcomes (M9 §3)
  - - scheduler
    - scheduler
    - usage pools reserved, or a capacity denial emitted (M9 §3)
  - - scheduler
    - board
    - board-stasis gate excludes an unchanged cooldown builder lane (M9 §3)
  - - scheduler
    - scheduler
    - NOOP-PACING spaces a no-artifact lane, doubling to 8× the floor (M9 §3)
  - - scheduler
    - crier
    - admitted — the envelope is dispatched (CT-02)
  note: refused means a named reason — budget hold, cooldown, load gate, fairness, namespace allocation (OUTLINE F11); an unreadable board is never treated as no work
  target_revision: CF2A-01/P5-A
  normative_source: Part II F11; Part I 1.9
- id: F12
  name: CREDENTIAL LIFECYCLE
  question: How does a credential stay fresh, scoped and out of argv?
  steps:
  - - owner
    - authority
    - Enroll provider references and service principal scopes
  - - github
    - github_provider
    - GitHub App issuance to broker, not node write-token delivery
  - - broker
    - gitlab_provider
    - GitLab project token issue/discover/rotate/revoke; scoped denial proof
  - - authority
    - dispatcher
    - Attempt capability <=300 s, attenuated scope and fence
  - - manager
    - authority
    - End/crash revoke; independent denied-use probe before settlement
  legacy_steps:
  - - owner
    - github
    - mint from an 0600 App private key — JWT → installation token (M7 §5)
  - - github
    - owner
    - token written to a 0600 file; the value is never printed (M7 §7)
  - - github
    - node
    - refresh --node installs auth/github.token on the node (M7 §5)
  - - scoper
    - dispatcher
    - fleet-gh-scope mints the per-dispatch scoped token (M11 §6)
  - - node
    - proxy
    - node bearer checked against the token file — fail-closed admission (M12 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F12; Part I 1.9
- id: F13
  name: UPGRADE AND MIGRATION
  question: How does a pinned bump or schema change reach the running system?
  steps:
  - - owner
    - manager
    - Exact release lock and role/protocol compatibility; reject unsupported
  - - manager
    - dispatcher
    - F8.1 drain old wire-format rounds; F15 verified backup
  - - manager
    - authority
    - Upgrade authority/broker, then manager store/runtime
  - - manager
    - crier
    - Custody then memory/board adapters; copied migration verify/switch
  - - provisioner
    - bunker
    - Bunkerd/client then Hermes pinned runtime
  - - manager
    - scheduler
    - Admission last after readback; incompatible versions quarantined
  - - manager
    - manager
    - Before new writes rollback; after schema writes forward repair or isolated F15 restore
  legacy_steps:
  - - owner
    - harness
    - pin bump — the installer fetches a digest-checked artifact (M5 §5)
  - - harness
    - owner
    - installed version read back against the pin; drift named (M5 §10)
  - - owner
    - scheduler
    - migration stores apply schema change to the 30-table store (M9 §3)
  - - owner
    - board
    - boardctl normalize-statuses migrates the row vocabulary (M4 §4)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F13; Part I 1.9
- id: F14
  name: OBSERVABILITY INGESTION
  question: Where does a tick, turn or message become a visible, attributed line?
  steps:
  - - foreman
    - foreman
    - Journal progress.v1 at transitions and every 10 seconds
  - - foreman
    - manager
    - 'Authenticated PUT: seq/digest/fence validation; fsync ack'
  - - manager
    - owner
    - 'GET live progress: last sample, receive age, quality; scope ACL'
  - - node
    - sessionstore
    - Native turn records separate from semantic memory
  - - manager
    - owner
    - CT-30 outbox events; independent subscriber retry and cursor
  - - foreman
    - manager
    - Reconnect flushes queued seq; gaps/conflicts visible
  legacy_steps:
  - - node
    - sessionstore
    - every turn, model, tokens and cost recorded (CT-11)
  - - scheduler
    - sessionstore
    - tick and spawn counters served at /api/v1/metrics (M9 §8)
  - - proxy
    - proxy
    - usage and capture JSONL appended per request; capture loss is silent (M12 §11)
  - - foreman
    - duckbrain
    - decisions, findings and goals written to durable memory (CT-15)
  - - scheduler
    - duckbrain
    - scheduler syncs its namespace every 5 m (M9 §5)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F14; Part I 1.9
- id: F15
  name: BACKUP AND RESTORE
  question: Can an artifact be restored and proven?
  steps:
  - - owner
    - manager
    - Explicit backup policy or refuse; create needs no prior artifact
  - - manager
    - scheduler
    - Close admission barrier
  - - manager
    - dispatcher
    - F8.1 drain/checkpoint all scoped writers
  - - manager
    - broker
    - Resolve effects; freeze canonical writes
  - - manager
    - crier
    - Hold custody checkpoint then namespace and manager checkpoints
  - - manager
    - duckbrain
    - Capture Git objects/refs, SQLite native snapshots, evidence and journal
  - - manager
    - owner
    - Off-host readback; signed cf.backup.v1 consistency marker; reverse release
  - - provisioner
    - node
    - Isolated restore and source-specific integrity/readback
  - - manager
    - authority
    - Current revocations/epochs, or revoke-all/new-authority; never restore old authority
  - - manager
    - scheduler
    - Fresh credentials and verified binding; record actual RPO/RTO
  legacy_steps:
  - - owner
    - board
    - board_drift compares the checkout's board against origin/main row by row (M4 §7)
  - - scheduler
    - board
    - --verify-board checks board consistency at boot (M9 §5)
  - - owner
    - duckbrain
    - restore into a scratch home; a known row read back (OUTLINE F15)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F15; Part I 1.9
- id: F16
  name: MULTI-NODE FAN-OUT
  question: How does one directive reach several nodes, each with its own receipt?
  steps:
  - - scheduler
    - scheduler
    - Validate fanout.v1 explicit policy; immutable target snapshot
  - - scheduler
    - crier
    - Durable per-target IDs; bounded concurrency; unreachable is outcome
  - - crier
    - dispatcher
    - Each target uses fenced execution and final-settlement receipt
  - - scheduler
    - manager
    - fail_fast/cancel/deadline invokes F8.1; replacement only resume_fenced
  - - scheduler
    - scheduler
    - Aggregate success/partial/failed/cancelled/timed_out from receipts
  - - scheduler
    - owner
    - Retain per-target and late-result evidence; no repeated settled execution
  legacy_steps:
  - - scheduler
    - dispatcher
    - envelope addressed to each target agent in the registry (M11 §3 S4)
  - - dispatcher
    - bunker
    - bunker exec runs the harness inside each target container (M11 §3 S1)
  - - dispatcher
    - crier
    - reply delivered before ack; a redelivery replays, never re-runs (M11 §3 S3)
  - - dispatcher
    - dispatcher
    - serial loop — one long job head-of-line-blocks later agents (M11 §11 F11-5)
  - - crier
    - scheduler
    - completion settles per dispatch (CT-06)
  target_revision: CF2A-01/P5-A
  normative_source: Part II F16; Part I 1.9

