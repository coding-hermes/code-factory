  mode: human/foreman action
  state: UNVERIFIED
  legacy_coverage:
    state: UNVERIFIED
    note: completion requires --evidence-run-id (boardctl update); the verdict→close path was not re-run (M4 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-14
  from: foreman
