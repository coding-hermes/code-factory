  state: UNVERIFIED
  legacy_coverage:
    state: UNVERIFIED
    note: the store is measured (357 rows / 520 events); the foreman write wire is not exercised in this repo (M4 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-15
  from: foreman
  to: duckbrain
  carries: Same-namespace shared-Git decisions/findings; local commit, controller readback and sync freshness
  mode: mcp / http
  state: UNVERIFIED
  signal: SHARED VIEW
  legacy_coverage:
    state: UNVERIFIED
    note: boundary — the foreman lane and the duckbrain service are out of scope (M9 §6); the foreman writes through the DuckBrain installed in its own Bunker, which must expose the same logical project memory data/view as the controller (resolved decision 2; physical topology unresolved)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-16
  from: docsgate
  to: handbook
  carries: module status word
  mode: read at build
  state: UNVERIFIED
  legacy_coverage:
