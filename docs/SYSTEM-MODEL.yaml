# SYSTEM-MODEL — the system as components and contracts, not as files.
#
# The point of this file: a box here is a RESPONSIBILITY, not a path. Paths live in `impl` and are
# marked volatile — if a script moves, the model does not change, only its implementation note does.
#
# Every component, contract and flow step below is TRACEABLE: a component to its module chapter
# Target authority: Part IV IV.1 canonical CT-01..CT-30 plus CT-06R, Part V, Part I 1.9.
# Legacy coverage is separately retained; source citations never redefine target behavior.
#
# Edit this, then run scripts/gen_handbook_figures.py. Every diagram is generated from this file.
# Contract state vocabulary (STYLE-CORRECTIONS §"CT-nn stays a registry id"):
#   PROVEN | PARTIAL | BROKEN | MISSING | UNVERIFIED

doc:
  id: CF2A-10
  title: CODE-FACTORY SYSTEM VIEWS
  subtitle: Components, contracts and flows
  target_revision: CF2A-01/P5-A
  authority_order:
  - Part IV IV.1 canonical envelope and IDs
  - Part V factory.v1 configuration and shared-Git memory
  - Part I 1.9 explicit P5-A refinements
  - Part II target procedures
  - SYSTEM-MODEL derived views
  conflict_behavior: SPEC_CONFLICT blocks issue; implementation never arbitrates target requirements
  figure_release_gate: Wave C regenerates figures and BOOK caption from this model digest; no generated artifact is claimed current by P5-A

layers:
  - id: control
    name: CONTROL PLANE
    blurb: decides what should happen
  - id: transport
    name: TRANSPORT
    blurb: carries the decision
  - id: execution
    name: EXECUTION
    blurb: does the work
  - id: memory
    name: MEMORY
    blurb: remembers what happened
  - id: governance
    name: GOVERNANCE
    blurb: decides whether to believe it
  - id: evidence
    name: EVIDENCE
    blurb: what a human reads

# Component and canonical-contract counts derive from the parsed collections.
# Module IDs preserve implementation coverage; additional boundary peers have no module.
components:
- id: owner
  name: OPERATOR
  role: intent and approval
  layer: control
  owns: Intent, priorities, approval
  not: Does not execute work
  impl:
  - human
  host: external
- id: scheduler
  name: SCHEDULER
  role: whose turn it is
  layer: control
  module: M9
  owns: Whose turn it is; lane admission (tasks vs cooldown); per-lane cadence, weight, pin; settlement of every dispatch
  not: Does not run work, does not know what a diff contains
  impl:
  - coding-hermes-scheduler
  host: control
- id: foreman
  name: FOREMAN (Hermes)
  role: budgeted project rounds
  layer: control
  host: bunker
  owns: 'Inside Bunker: fixed authorized task scope, compatible waves, durable total-worker budget, verification, board and worker/wave/round memory; Part I 1.9.6/9'
  not: Does not grade its own homework; its response returns through Crier to the scheduler (resolved decision 1)
  impl:
  - prompts/foreman.md
  - skills/code-factory-foreman
- id: github
  name: GITHUB CREDENTIALS
  role: forge authentication
  layer: control
  module: M7
  owns: Mints, caches and refreshes GitHub App installation tokens; never a token in argv (M7 §2)
  not: Does not mint the per-dispatch scoped token or the node tokens (M7 §12)
  impl:
  - scripts/github-app-setup.sh
  - scripts/github-app-token.py
  - scripts/github-app-refresh.sh
  host: control
- id: scoper
  name: SCOPE MINTER
  role: per-dispatch token
  layer: control
  module: M11
  owns: Mints the per-dispatch scoped GitHub token the dispatcher injects (M11 §3 S4)
  not: A separate minter from M7's github-app-token.py (M7 §12)
  impl:
  - ~/.hermes/scripts/fleet-gh-scope.py
  host: control
- id: manager
  name: FACTORY MANAGER
  role: deterministic IaC reconciliation
  layer: control
  tag: UNBUILT
  owns: The deterministic infrastructure-as-code control service — declared desired state and a durable observed inventory for the whole Factory; settings mapping and adapters for the participating systems; deterministic diff/plan and authorized idempotent apply/reconcile; continuous drift detection, readiness and scoped repair; host-loss replacement placement and Crier/scheduler binding updates (V2-ARCH-01)
  not: Infrastructure convergence is deterministic code, never LLM-improvised tool sequencing; does not choose tasks (foreman), admit lanes or settle rounds (scheduler), deliver work (Crier), provide per-host execution/isolation (Bunker) or hold Boardctl work authority — Boardctl carries project work, not configuration authority (V2-SET-08)
  note: TARGET-UNIMPLEMENTED; language open, transactional Git-backed JSONL single-writer profile fixed in Part I 1.9.2; authority/broker and adapter protocols in 1.9.3-5
  impl:
  - TARGET-UNIMPLEMENTED
  host: control
- id: crier
  name: CRIER (bus)
  role: launch and return boundary
  layer: transport
  module: M10
  owns: The launch/return boundary between control host and Bunkers — delivery with per-agent signature, leases, replies, idempotency (M10 §2); the foreman response returns through Crier to the scheduler
  not: Does not decide, does not execute; no board admission (M4 §12 B04); delivery is not task acceptance
  impl:
  - crier
  host: control
- id: guard
  name: GUARD
  role: screens every directive
  layer: governance
  module: M10
  owns: Fail-closed directive screening before custody/launch; outage or invalid classifier response refuses; admin-owned policy; Part I 1.3.5 and F9
  not: A false pass lets an untrusted directive reach a node (M10 §2)
  impl:
  - crier internal/guard/guard.go
  host: control
- id: gateway
  name: HERMES GATEWAY
  role: session API
  layer: transport
  owns: Control instance serves telemetry; Bunker instance accepts CT-08 work sessions; never a controller foreman fallback
  not: Does not schedule or store the ledger
  impl:
  - hermes gateway
  host: controller-and-bunker
- id: proxy
  name: INFERENCE PROXY
  role: holds the provider key
  layer: transport
  module: M12
  owns: The only holder of the provider credential; admits nodes by token, models by allowlist, streams or buffers (M12 §2)
  not: No anonymous paid path; a node never sees a provider key (M12 §2)
  impl:
  - ~/.hermes/scripts/cf-inference-proxy.py
  host: control
- id: bunker
  name: BUNKER DAEMON
  role: the deployment and execution boundary
  layer: execution
  host: bunker
  owns: The Bunker deployment/execution boundary itself — hosts agent containers; create/exec/cp; per-agent home
  not: Does not own credentials or config
  impl:
  - bunker
- id: node
  name: NODE
  role: one project, one node
  layer: execution
  host: bunker
  module: M2
  owns: One project per node; the node runs inside its Bunker; repo clone, seeded prompts/skills, env, identity, bus worker (M2 §2)
  not: Does not decide what to work on
  impl:
  - scripts/project-node.sh
  - scripts/node-bus-worker.py
- id: router
  name: TASK-ROUTER
  role: future harness selection
  layer: execution
  tag: FUTURE
  owns: FUTURE and NOT PART OF MVP — placed after Node and before Harness; a future selection responsibility (harness selection is design intent; today's router documentation describes provider/model selection)
  not: The MVP bypasses this point and uses the fixed Hermes harness directly; do not equate future harness selection with the separate current model/provider route
  impl:
  - task-router
  host: control
- id: harness
  name: HARNESS
  role: the coding loop
  layer: execution
  host: bunker
  module: M5
  owns: The coding loop inside the node — Hermes is the fixed MVP harness — plus codex, claude-code, opencode, pi, dsh at pins (M5 §2)
  not: Does not write the board
  impl:
  - scripts/harness/*
- id: dispatcher
  name: DISPATCHER
  role: executes the dispatch
  layer: execution
  host: bunker
  module: M11
  owns: Resident Bunker adapter launches only local round cgroup under project identity, maintains replay/checkpoint ledger; legacy controller bunker-exec path is coverage only
  not: May not decide admission or what the work is (M11 §2)
  impl:
  - ~/crier-fleet/dispatcher.py
- id: provisioner
  name: PROVISIONER
  role: bare host to node
  layer: execution
  module: M1
  owns: Qualifies the host (disk floor), creates the container, mints identity, seeds prompts/skills/env, connects the bus (M1 §2)
  not: Does not certify the result — that is the verifier (M1 §12)
  impl:
  - scripts/bunker-provision.sh
  - scripts/project-node.sh
  - scripts/node-create.sh
  host: control
- id: lander
  name: LANDER
  role: work into main
  layer: execution
  module: M3
  owns: 'Broker CAS publication: configured destination, merge/FF ancestry or squash/rebase tree mapping, exact-tree gates; Part I 1.9.7'
  not: Operator-triggered — the envelope names branch/commit, it does not call the lander (M3 §2 F3-5)
  impl:
  - scripts/land-node-branch.sh
  host: control
- id: board
  name: BOARD
  role: the plan and its state
  layer: memory
  module: M4
  owns: Canonical Git remote ref CAS publishes task/event/marker atomically; foreman owns claim retries; scheduler refreshes only its read copies; Part I 1.9.6
  not: Not a run log; rows are reused across attempts; a local copy and the remote copy are distinct until a recorded refresh or publication reconciles them
  impl:
  - .coding-hermes/board/tasks.jsonl
  - scripts/boardctl
  host: control
- id: duckbrain
  name: DUCKBRAIN
  role: searchable memory
  layer: memory
  host: controller-and-bunker
  owns: Namespaced durable memory; run records, findings, recall; installed in every Bunker and on the control host
  not: Same-namespace shared-Git profile selected in Part V; fsynced local commit is acknowledgement, sync separate; local-only requires shared view; F3
  impl:
  - duckbrain
- id: sessionstore
  name: SESSION STORE
  role: every turn and its cost
  layer: memory
  owns: Every model turn, its model, tokens and cost
  not: Not the plan, not the product
  impl:
  - ~/.hermes/state.db
  host: controller-and-bunker
- id: gitreins
  name: COMMIT GATE
  role: grades the commit
  layer: governance
  module: M3
  owns: Pre-commit grading (secrets, lint, tests) and the verdict that lands work (M3 §2)
  not: Does not decide what to build
  impl:
  - gitreins
  host: bunker
- id: docsgate
  name: DOC GATE
  role: grades the document
  layer: governance
  module: M6
  owns: Whether a document is citable (sections, locators, facts, earned VERIFIED) — a structural gate, not a truth verifier (M6 §2 F6-2)
  not: Cannot tell whether a sentence is true
  impl:
  - scripts/master_doc_check.py
  host: control
- id: conformance
  name: CONFORMANCE BATTERY
  role: grades the harness
  layer: governance
  module: M5
  owns: Whether a harness is supported, measured per leg on a real node (M5 §2)
  not: Does not install anything by itself
  impl:
  - tests/harness-conformance.sh
  host: control
- id: verifier
  name: NODE VERIFIER
  role: certifies the node
  layer: governance
  module: M1
  owns: The certification ladder — agent, gateway, auth, artifact, tree, seed; VERIFIED is earned per leg (M1 §11)
  not: An unreachable port is UNVERIFIED (exit 3), not FAIL (M1 §10 CF-224)
  impl:
  - scripts/verify-node.sh
  host: control
- id: safety
  name: SAFETY
  role: reaper and scan scope
  layer: governance
  module: M8
  owns: Reaps build caches and expired job dirs; refuses a gitleaks claim without its --log-opts scope (M8 §2)
  not: 'Age alone never authorizes deletion: retention holds and atomic tombstone CAS govern cleanup; Part I 1.9.8'
  impl:
  - scripts/reclaim_disk.py
  - scripts/check_scan_scope.py
  host: control
- id: panel
  name: DOC PANEL
  role: independent seats
  layer: governance
  module: M6
  owns: Three seats grade a module independently; splits are reported, never voted away (M6 §3 S4)
  not: A STOP exit is process success, not document acceptance (M6 §5)
  impl:
  - scripts/panel_loop.py
  - scripts/master_doc_panel.py
  host: control
- id: spine
  name: SPINE GATE
  role: cross-chapter consistency
  layer: governance
  module: M6
  owns: Canonical CT ids cited; producer/consumer and state agreement; dangling refs; count claims (M6 §3 S9)
  not: Checks locator presence, not that the cited line exists (M6 §3 S9)
  impl:
  - scripts/handbook_spine.py
  host: control
- id: handbook
  name: HANDBOOK
  role: what you approve
  layer: evidence
  module: M6
  owns: Approved target requirements plus implementation coverage; versioned precedence is doc.authority_order
  not: Implementation citations and generated figures cannot override the approved normative target
  impl:
  - scripts/gen_nasa_handbook.py
  - scripts/build_book.py
  host: control
- id: authority
  name: AUTHORITY
  role: authority
  layer: control
  host: authority
  owns: Independent trust/revocation and monotonic owner-epoch ledger; online permission; Part I 1.9.3; operator enrollment F2.0
  not: Does not choose project work or settle rounds
  impl:
  - TARGET-UNIMPLEMENTED
- id: broker
  name: MUTATION BROKER
  role: mutation broker
  layer: control
  host: control
  owns: Only forge write custodian; serializes fenced effects, board/ref/memory CAS and dispatch capability checks with takeover; Part I 1.9.3/7
  not: Does not choose project work or settle rounds
  impl:
  - TARGET-UNIMPLEMENTED
- id: github_provider
  name: GITHUB PROVIDER
  role: github provider
  layer: transport
  host: external
  owns: External GitHub App issuer and protected Git refs; CT-21 provider boundary
  not: Does not choose project work or settle rounds
  impl:
  - external-boundary
- id: gitlab_provider
  name: GITLAB PROVIDER
  role: gitlab provider
  layer: transport
  host: external
  owns: External GitLab project access-token issuer and protected Git refs; CT-21; Part I 1.9.7
  not: Does not choose project work or settle rounds
  impl:
  - external-boundary
- id: inference_provider
  name: INFERENCE PROVIDER
  role: inference provider
  layer: transport
  host: external
  owns: Explicit configured model upstream; provider key received only through proxy; CT-20
  not: Does not choose project work or settle rounds
  impl:
  - external-boundary

contracts:
- id: CT-01
  from: owner
  to: scheduler
  carries: lane enabled, cadence, weight, pin
  mode: config
  state: UNVERIFIED
  legacy_coverage:
    state: UNVERIFIED
    note: boundary — the producer is a human writing fleet.toml and scheduler.db project rows; the consumer is admission_mode.go:112 admissionModeForProject (M9 §6)
    sender_guarantee: the owner declares it — fleet.example.toml:15,35 (per-lane weight, enabled); project admission rows in scheduler.db are the source of record
    receiver_requirement: internal/scheduler/admission_mode.go:112 — admissionModeForProject resolves the project row (override → namespace default → cooldown)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-02
  from: scheduler
  to: crier
  carries: 'cf2a.v1 / round-admission.v1: round/run/correlation IDs, fixed task_scope, total_budget, config_generation, fenced binding extension'
  mode: async, bearer + signature
  state: UNVERIFIED
  legacy_coverage:
    state: PROVEN
    note: CF-354 fixed — crier HandleDeliver delivers the envelope verbatim (M9 §6, M10 §6)
    sender_guarantee: internal/bus/dispatch.go:202,266 — BuildDispatch renders run_id/corr_id/lane/board/text_b64 and signs before POST
    receiver_requirement: crier internal/registry/handler.go:990 — HandleDeliver accepts the by-id delivery into the durable inbox
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-03
  from: crier
  to: node
  carries: inbox message + lease
  mode: pull, 30 s lease
  state: UNVERIFIED
  signal: LAUNCH
  legacy_coverage:
    state: PROVEN
    note: the node worker (M2 §6) and the dispatcher (M11 §6) are the two consumers; the node executes inside its Bunker — Crier is the launch boundary (resolved decision 1)
    sender_guarantee: 'crier internal/registry/handler.go:990 — deliver(): durable inbox write with lease/ack/TTL semantics'
    receiver_requirement: scripts/node-bus-worker.py:1356,1383 — signed GET /agents/<id>/inbox retrieve, then /inbox/ack
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-04
  from: node
  to: crier
  carries: 'reply: status, dispatch_id, corr_id, branch, commit, artifacts'
  mode: async, signed
  state: UNVERIFIED
  legacy_coverage:
    state: PARTIAL
    note: transport works; settlement reads only `ok` — CF-355 open (M2 §6, M9 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-05
  from: foreman
  to: harness
  carries: 'worker-brief.v1: round, wave, task, attempt, criteria, workspace, brief digest'
  mode: resident launch custody
  state: UNVERIFIED
  legacy_coverage:
    state: UNVERIFIED
    note: both ends in-repo (load_lane_config.py:31 → spawn.go:1249 buildForemanPrompt); the "3 of 14 lanes disagree" breakage was never measured (M9 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-06
  from: crier
  to: scheduler
  carries: completion event for a finished run
  mode: async
  state: UNVERIFIED
  signal: FOREMAN RETURN
  legacy_coverage:
    state: PROVEN
    note: the resolved return path — the Bunker foreman's response travels through Crier back to the scheduler on the control host, which records it and triggers subsequent processing (resolved decision 1); the dispatcher leg works — it always sends `ok`, the field dispatchReplyVerdict reads (M11 §6)
    sender_guarantee: crier internal/registry/handler.go:170,1452 — the answering message carries ReplyTo correlation into the scheduler's durable inbox
    receiver_requirement: internal/scheduler/dispatch_leg.go:713 — dispatchReplyVerdict reads the correlated payload's ok (first message wins, :428)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-06R
  from: foreman
  to: crier
  carries: the foreman's durable response (return leg of CT-06)
  mode: async, signed
  state: UNVERIFIED
  signal: RETURN LEG
  label_dx: 70
  legacy_coverage:
    state: UNVERIFIED
    note: resolved decision 1 — Crier is the launch/return boundary; the foreman response enters Crier inside the Bunker and leaves for the scheduler, which records it and triggers subsequent processing; the foreman-side producing call is not yet contract-cited, so this leg is UNVERIFIED until Part IV reconciles it with CT-06
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-07
  from: router
  to: gateway
  carries: model choice for a prompt
  mode: in-band
  state: UNVERIFIED
  legacy_coverage:
    state: UNVERIFIED
    note: boundary — neither side has an in-repo file:function; the wire was not measured (M12 §6). The Task Router itself is FUTURE and NOT PART OF MVP, placed after Node and before Harness with future harness-selection responsibility; do not equate that future selection with this separate current model/provider route
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-08
  from: crier
  to: gateway
  carries: Bunker-local session custody; controller gateway is telemetry only
  mode: sync, 30 s
  state: UNVERIFIED
  legacy_coverage:
    state: PROVEN
    note: crier side named — hermesession.go:353 Client.Deliver (M10 §6)
    sender_guarantee: crier internal/hermesession/hermesession.go:353 — Client.Deliver; :554 POSTs /api/sessions at the gateway origin
    receiver_requirement: hermes gateway/platforms/api_server.py:1763 — POST /api/sessions creates the session row from the delivered message
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-09
  from: foreman
  to: duckbrain
  carries: worker/wave/round records, local_commit receipt, pending-sync/fresh/stale
  mode: http, x-api-key
  state: UNVERIFIED
  legacy_coverage:
    state: MISSING
    note: node-bus-worker has zero DuckBrain calls (CF-329, M2 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-10
  from: foreman
  to: board
  carries: 'canonical board CAS: claimant_id, claim_id, lease_expires_at, claim_generation, row/event transaction marker'
  mode: broker-mediated Git remote ref CAS
  state: UNVERIFIED
  legacy_coverage:
    state: BROKEN
    note: the node worker writes no board rows — no in-repo producer (M4 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-11
  from: node
  to: sessionstore
  carries: every turn, model, tokens
  mode: writes via gateway
  state: UNVERIFIED
  legacy_coverage:
    state: UNVERIFIED
    note: boundary — both ends are the Hermes runtime, out of scope (M2 §6)
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-12
  from: node
  to: gitreins
  carries: staged diff
  mode: pre-commit hook
  state: UNVERIFIED
  legacy_coverage:
    state: UNVERIFIED
    note: the hook side is named (install-gitreins.sh:124); hook enforcement — that git invokes it — is unproven (M3 §6, M3 §11)
    sender_guarantee: scripts/install-gitreins.sh:124 — the pre-commit hook pins $VENV/bin/gitreins guard --quality-async on every seeded repo
  target_revision: CF2A-01/P5-A
  normative_source: Part IV IV.1; Part I 1.9; Part II
  note: Target contract not certified by legacy transport measurements; see legacy_coverage and normative_source
- id: CT-13
  from: gitreins
  to: board
