execution_contracts:
  schema_version: cf.execution-contracts.v1
  status: normative-target; implementation and runtime qualification remain separate
  vector_source: docs/handbook/contract-vectors.json
  ownership_manifest:
    scheduler:
      owns: [round admission, worker allowance, round report receipt, settlement]
      does_not_own: [native exec, Crier delivery lease, board claim CAS]
    foreman:
      owns: [wave derivation, immutable brief, claim request, worker and round memory]
      does_not_own: [scheduler settlement, proxy usage ledger, remote forge readback]
    crier:
      owns: [signed custody, delivery identity, retrieve replay, lease renewal, acknowledgement]
      does_not_own: [worker verdict, board status, scheduler settlement]
    supervisor:
      owns: [launch_id, execution_key, start permit, native result, reconciliation]
      does_not_own: [round allowance, model judgment, publication qualification]
    board_writer:
      owns: [row and event reduction, operation marker, protected-ref CAS, remote readback]
      does_not_own: [harness execution, inference usage, backup release]
    inference_proxy:
      owns: [token scope, budget reservation, request identity, seq-zero stream, usage commit]
      does_not_own: [worker allowance, task verdict, forge publication]
    authority:
      owns: [owner fence, dispatch grant, effect receipt, revocation, backup recovery decision]
      does_not_own: [project work selection, model judgment]
  lexical_types:
    UInt: {json_type: integer, minimum: 0, maximum: 9007199254740991, booleans: forbidden}
    PosInt: {json_type: integer, minimum: 1, maximum: 9007199254740991}
    RoundAllowance: {json_type: integer, minimum: 0, maximum: 20000, note: 20000 is legal}
    ID: {json_type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    Time: {json_type: string, format: 'YYYY-MM-DDTHH:MM:SS[.sss]Z', offsets: forbidden, leap_seconds: forbidden}
    SHA: {json_type: string, pattern: '^[0-9a-f]{64}$'}
    Text: {json_type: string, utf8_bytes: 1..65536, nul: forbidden}
    EvidenceRef: {json_type: string, pattern: '^cas\+sha256://<project_id>/<64-lowercase-hex>$'}
    Error:
      closed: true
      fields:
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,127}$'}
        message: {type: Text}
        retryable: {type: boolean}
        field: {type: string-or-null, format: JSON-pointer}
        current_generation: {type: UInt-or-null}
    Fence:
      closed: true
      fields: {authority_id: ID, project_id: ID, epoch: PosInt, owner_id: ID}
  shared_rules:
    objects: Closed unless a field is explicitly optional; null never means absent.
    json: RFC 8785 JCS, UTF-8 without BOM, sorted object keys, no trailing LF.
    digest: Lowercase SHA-256 over the exact canonical bytes named by the record.
    integers: JSON booleans and floating-point resource values are rejected.
    idempotency: The first request digest is durable; same identity with different bytes is a conflict.
    time: Deadlines use the owner's monotonic clock; wall timestamps are evidence only.
    errors: [INVALID_FIELD, RANGE_INVALID, UNSUPPORTED_VERSION, STALE_OWNER, CONFIG_VERSION_CONFLICT, CLAIM_CONFLICT, LAUNCH_CONFLICT, USAGE_UNSETTLED, EFFECT_UNRESOLVED]
  envelope:
    schema_version: cf2a.v1
    closed: true
    fields:
      schema_version: {type: string, const: cf2a.v1}
      message_type: {type: ID}
      request_id: {type: ID}
      corr_id: {type: ID}
      sender: {type: ID}
      created_at: {type: Time}
      body: {type: object}
    response:
      fields: {schema_version: string, status: 'ok|accepted|error', data: object-or-null, error: Error-or-null}
      invariant: An accepted transport response is not an execution verdict.
  records:
    Enrollment:
      schema_version: register.v1
      fields: '{registration_id:ID,agent_id:ID,project_id:ID,expected_generation:UInt,profile:ID,public_identity:{certificate_der:Text,key_id:ID},capabilities:ID-set,enrollment_nonce:Text}'
      durability: Nonce consumption, principal enrollment and generation allocation commit atomically; expected_generation=0 allocates 1.
      replay: Same registration_id/idempotency_key and digest replays; changed bytes or nonce reuse refuses before credential staging.
      output: registration generation, expiry and CredentialRef only; private keys and bearer values are absent.
    DispatchGrant:
      schema_version: dispatch-grant.v1
      fields: '{grant_id:ID,project_id:ID,round_id:ID,run_id:ID,corr_id:ID,binding_generation:PosInt,owner_fence:Fence,destination:{agent_id:ID,endpoint_digest:SHA},admission_digest:SHA,requested_expiry_s:integer[1,30]}'
      states: 'issued|consumed|expired|revoked'
      consume: Manager atomically compares token hash and all bound fields, transitions issued -> consumed and inserts the Crier delivery outbox marker.
      errors: [GRANT_CONFLICT, GRANT_REUSED, GRANT_EXPIRED, GRANT_UNAVAILABLE, BINDING_NOT_ACTIVE]
      recovery: GET /v1/dispatch-grants/{grant_id} plus Crier delivery readback resolves a lost consume reply; no second grant, round or launch is created.
    ParticipantBinding:
      prepare_schema: binding.prepare.v1
      commit_schema: binding.commit.v1
      fields: '{operation_id:ID,project_id:ID,binding_generation:PosInt,owner_fence:Fence,participant_id:ID,prepared_digest:SHA,active_digest:SHA,committed_at:Time,idempotency_key:ID}'
      durability: Crier and Scheduler persist non-routable candidates before manager pointer commit, then atomically activate the matching prepared digest.
      recovery: A one-sided acknowledgement replays the same participant commit and serves the durable operation; grants remain BINDING_NOT_ACTIVE until both readbacks agree.
      error: BINDING_CONFLICT on changed tuple/digest; no rollback to an earlier generation after pointer commit.
    SecretResolution:
      schema_version: secret-resolve.v1
      request: '{request_id:ID,corr_id:ID,credential_ref:CredentialRef,operation:ID,idempotency_key:ID}'
      transport: owner-only broker Unix socket, maximum 65536 bytes, SO_PEERCRED principal; a caller principal field is forbidden.
      response: '{schema_version,request_id,credential_ref,fingerprint,expires_at,scope} plus exactly one SCM_RIGHTS sealed memfd; JSON contains no secret bytes.'
      seals: [F_SEAL_SEAL, F_SEAL_SHRINK, F_SEAL_GROW, F_SEAL_WRITE]
      fanout: Each consumer receives an independently scoped one-use transfer; no broadcast descriptor or environment variable exists.
      errors: [UNAUTHORIZED, CAPABILITY_REVOKED, REFERENCE_UNKNOWN, RESOLVER_UNAVAILABLE, TRANSFER_CONSUMED]
    RoundAdmission:
      schema_version: round-admission.v1
      writer: scheduler
      durability: The round row commits before CT-02 delivery; the Crier queued receipt precedes accepted.
      fields:
        idempotency_key: ID
        round_id: ID
        run_id: ID
        corr_id: ID
        task_scope: ID-array
        total_budget: RoundAllowance
        config_generation: PosInt
        execution:
          round_deadline: Time
          deadline_s: PosInt
          attempt_wall_s: PosInt
          turn_timeout_s: PosInt
          max_turns: PosInt
          concurrency: PosInt
          retry_policy: RetryPolicy
          launch_reserve_s: UInt
          transfer_reserve_s: UInt
          cleanup_reserve_s: UInt
        extensions:
          project_id: ID
          lane: ID
          board_revision: GitOID
          binding_generation: PosInt
          owner_fence: Fence
          lane_seed: {prompt_digest: SHA, skills: string-array}
      forbidden_at_admission: [wave_id, worker_id, attempt_id]
    Criterion:
      closed: true
      fields:
        id: ID
        description: Text
        argv: string-array, 1..64 direct argv entries without a shell
        cwd: safe repository-relative path
        timeout_s: integer, 1..1800 seconds
        expected_exit: integer, 0..255
        oracle_digest: SHA
      legacy_projection: text and verification survive only as migration evidence; they are never executable canonical fields.
    TaskRow:
      schema_version: cf.board-task.v1
      writer: board_writer
      fields:
        schema_version: {type: string, const: cf.board-task.v1}
        kind: {type: string, const: task}
        id: ID
        initiative_id: ID
        revision: PosInt
        operation_id: ID
        title: Text
        status: 'pending|in_progress|blocked|deferred|cancel_requested|cancelled|complete'
        complexity: integer, 1..10
        reasoning: Text
        acceptance_criteria: Criterion-array, 1..100
        depends_on: unique bytewise-sorted ID-array
        created_seq: UInt, immutable and unique within the initiative
        paths: 1..1024 normalized repository-relative prefixes
        resources: Resource-array with unique names and exclusive/shared modes
        fixture: boolean
        created_at: Time
        updated_at: Time
        claim: Claim-or-null
        cancel_request: CancelRequest-or-null
        deferral: Deferral-or-null
        completion: Completion-or-null
      ordering: ascending (created_seq,id) after dependency and correction eligibility; lane priority is not a task field.
      correction: A correction retains the same task, claim and original worker until terminal disposition; it never waits behind its own new claim.
    GroupClaimRequest:
      schema_version: cf.board-group-claim.v1
      writer: foreman
      fields:
        operation_id: ID
        idempotency_key: ID
        project_id: ID
        board_id: ID
        board_revision: GitOID
        owner_fence: Fence
        ordering: string
        claims: ClaimPrecondition-array
        lease_expires_at: Time
        transition: 'claim|renew|release'
        evidence_refs: EvidenceRef-array
      claim_precondition: {task_id: ID, created_seq: PosInt, expected_revision: UInt, expected_status: 'pending|in_progress', claim_generation: UInt}
      atomicity: One protected old-OID to candidate-OID CAS commits every row, event and operation marker or none.
      loser: CLAIM_CONFLICT returns current board_revision and changed task ids; no partial wave launches.
      commit_point: Remote marker, row and event readback precedes native start.
      lease: Broker monotonic 120 seconds, renewed every 40 seconds; requested expiry is only an upper bound.
    BriefInput:
      schema_version: cf.brief-input.v1
      fields: {directive: Text, task: TaskRow, criteria: Criterion-array, skills: string-array, attachments: EvidenceRef-array}
      digest: JCS of the complete object.
    WorkerBrief:
      schema_version: worker-brief.v1
      fields:
        idempotency_key: ID
        project_id: ID
        round_id: ID
        run_id: ID
        wave_id: ID
        worker_id: ID
        task_id: ID
        attempt_id: ID
        dispatch_id: ID
        owner_fence: Fence
        claim_id: ID
        claim_generation: PosInt
        brief_ref: EvidenceRef
        brief_digest: SHA
        criteria: Criterion-array
        workspace: Workspace
        effective: EffectiveSettings
      immutable: A changed input requires a new attempt and claim generation.
    WorkerResult:
      schema_version: worker-result.v1
      fields:
        idempotency_key: ID
        project_id: ID
        round_id: ID
        run_id: ID
        wave_id: ID
        worker_id: ID
        attempt_id: ID
        dispatch_id: ID
        corr_id: ID
        owner_fence: Fence
        execution_key: SHA
        status: 'pass|fail|unverified|partial|unknown'
        commit: GitOID-or-null
        artifacts: Artifact-array
        evidence_refs: EvidenceRef-array
        finished_at: Time
        error: Error-or-null
      invariant: Worker status is an execution fact, not settlement or board closeout.
    RoundReport:
      schema_version: round-report.v1
      fields:
        idempotency_key: ID
        project_id: ID
        round_id: ID
        run_id: ID
        corr_id: ID
        owner_fence: Fence
        waves: WaveResult-array
        task_results: TaskResultRef-array
        budget: {allowance: RoundAllowance, consumed: RoundAllowance, reserved: RoundAllowance, remaining: RoundAllowance}
        stop_reason: 'no_useful_work|budget_exhausted|cancelled|paused|deadline|dependency_unavailable|failed'
        memory_refs: EvidenceRef-array
        evidence_refs: EvidenceRef-array
        status: 'pass|fail|unverified|partial|unknown'
        finished_at: Time
        report_digest: SHA
      digest: JCS of the complete record with report_digest absent.
      budget_invariant: remaining = allowance - consumed - reserved.
    MemoryRecord:
      schema_version: memory-record.v1
      discriminated_by: record_type
      common_fields:
        schema_version: {type: string, const: memory-record.v1}
        record_type: 'worker|wave|round|resolution|decision|finding'
        record_id: ID
        project_id: ID
        namespace: ID
        round_id: ID
        wave_id: ID-or-null
        attempt_id: ID-or-null
        task_id: ID-or-null
        owner_fence: Fence
        writer_id: ID
        local_seq: PosInt
        created_at: Time
        body: object
        payload_digest: SHA
      presence:
        worker: wave_id, attempt_id and task_id are required.
        wave: wave_id is required; attempt_id and task_id are null.
        round: wave_id, attempt_id and task_id are null.
        resolution: wave_id, attempt_id and task_id are null; body.resolution_of is non-empty.
        decision_finding: wave_id, attempt_id and task_id are null; body uses the generic evidence shape.
      bodies:
        worker: {outcome: string, result_ref: EvidenceRef, evidence_refs: EvidenceRef-array, relations: Relation-array}
        wave: {state: string, worker_refs: EvidenceRef-array, stop_reason: string, relations: Relation-array}
        round: {state: string, wave_refs: EvidenceRef-array, budget: RoundBudget, report_ref: EvidenceRef, relations: Relation-array}
        resolution: {resolution_of: EvidenceRef-array, action: string, reason: Text, evidence_refs: EvidenceRef-array}
        decision_finding: {text: Text, evidence_refs: EvidenceRef-array, relations: Relation-array}
      digest: JCS of the complete record with payload_digest absent; writer, fence, ids and body are included.
      local_commit: Temporary file, fsync, atomic rename and directory fsync acknowledge local-only durability.
      sync_receipt: MemorySyncReceipt is separate and mutable; it never changes payload_digest.
    MemorySyncReceipt:
      fields:
        record_id: ID
        payload_digest: SHA
        destination: string
        state: 'pending|qualified|failed|partial|conflict'
        remote_receipt: string-or-null
        attempts: UInt
        last_error: Error-or-null
      transitions:
        - local_commit -> pending; an HTTP outage never discards local work.
        - pending -> qualified only after canonical remote readback of record_id and payload_digest.
        - failed retries the same record and digest with a new sync attempt, never a new logical record.
        - partial reconciles all destination receipts after restart before settlement.
        - conflict preserves both digests and blocks settlement; no last-writer overwrite.
    SupervisorRequest:
      schema_version: supervisor.v1
      transport: Unix socket $HOME/.local/state/factory/supervisor/control.sock, mode 0600, peer UID verified.
      fields:
        schema_version: {type: string, const: supervisor.v1}
        request_id: ID
        idempotency_key: ID
        owner_fence: Fence
        project_id: ID
        method: {type: string, const: PUT}
        path: {type: string, pattern: '^/v1/launches/[A-Za-z0-9._:-]+$'}
        body: LaunchInput
      launch_identity: launch_id is owner identity; execution_key = SHA256(JCS({launch_id,input_digest})).
      replay: Identical request returns the original response; changed digest returns LAUNCH_CONFLICT without exec.
      retired: cf.supervisor.v1, .node/execution/control.sock and submit/status/cancel/drain/resume are not a second protocol.
    CustodyRequest:
      schema_version: custody.v1
      common_fields: {request_id: ID, idempotency_key: ID, owner_fence: Fence, registration_generation: PosInt}
      signature:
        algorithm: Ed25519
        encoding: lowercase hex
        transcript: 'METHOD\norigin-form-path\nX-Agent-Ts\nsha256:<body-sha256>\naudience:<principal>'
        nonce: request_id plus idempotency key prevents replay within the timestamp window.
        body_hash: SHA-256 of the complete wrapper; payload_digest names the application envelope.
      operations:
        retrieve: {agent_id: ID, poll_id: ID, limit: '1..100 default 10', lease_s: '30..300 default 60'}
        renew: {delivery_id: ID, lease_id: ID}
        ack: {delivery_id: ID, lease_id: ID, result_digest: SHA, result_custody_receipt: EvidenceRef}
      renewal: Every 20 seconds with a 5-second bounded call; it never creates a fresh poll or extends beyond deadline.
      replay: (agent_id,poll_id) returns original messages and lease after a lost response; it claims nothing new.
      durability: Claim and lease commit before response; unavailable storage is CUSTODY_UNAVAILABLE, never an empty inbox.
      expiry: LEASE_EXPIRED requires reconciliation; ack requires the matching durable result digest.
      retired: Three-line GET, audience-free signatures and lease_s 1..30 have no Factory authority.
    ChatRequest:
      schema_version: cf.inference.v1
      max_request_bytes: 1048576
      raw_transport_ceiling_bytes: 4194304
      fields:
        schema_version: {type: string, const: cf.inference.v1}
        model: string
        messages: ChatMessage-array
        stream: {type: boolean, default: false}
        options: InferenceOptions
        request_id: ID
        deadline: Time
      message:
        role: 'system|user|assistant|tool'
        content: string-or-null
        tool_calls: optional assistant ToolCall-array
        tool_call_id: required for tool and references a prior call
      options_closed: temperature, top_p, max_output_tokens, stop, tools and tool_choice are materialized; arbitrary provider keys refuse.
      errors: [INVALID_BODY, UNSUPPORTED_CONTENT, UNAUTHORIZED, FORBIDDEN, DEADLINE_EXCEEDED, BUDGET_EXHAUSTED, CONCURRENCY_EXHAUSTED, PRICING_UNAVAILABLE, PAYLOAD_TOO_LARGE]
    InferenceAuthorization:
      token_schema: cf.node-token.v1
      token_fields: '{token_id:ID,node_id:ID,project_id:ID,namespace:ID,allowed_routes:ID-set,allowed_models:Text-set,budget:NodeScope,concurrency:integer[1,64],issued_at:Time,expires_at:Time,generation:PosInt,scope_digest:SHA,revoked_at:Time-or-null,issuer_ref:EvidenceRef}'
      scope_fields: '{allowed_routes:ID-set,budget_micro_usd:UInt default 0,window_s:integer[60,86400] default 86400,concurrency:integer[1,64] default 1,max_output_tokens:integer[1,131072] default 4096}'
      credential_durability: Authorization ledger stores SHA-256(token bytes); clear bearer exists only in encrypted one-time recipient-bound delivery; restore never reactivates bearers.
      request_ledger: '{request_id:ID,digest:SHA,token_id:ID,generation:PosInt,window:UInt,reserved_cost:UInt,actual_cost:UInt-or-null,state:reserved|forwarding|settled|unsettled,upstream_id:ID-or-null,route_digest:SHA,tokenizer_digest:SHA,price_digest:SHA,result_ref:EvidenceRef-or-null,deadline:Time,created_at:Time,updated_at:Time}'
      admission: One serializable SQL transaction enforces spent + held + reserve <= budget and active < concurrency before forwarding; zero-price requests still reserve a slot.
      accounting: Unknown spend charges the full reservation and marks estimated; only proven no-send refunds once; known usage settles actual and releases the remainder.
      deadlines: upstream timeout 300 seconds; caller and upstream deadlines narrow by minimum; first-byte and total stream resource limits are finite.
      recovery: GET /v1/responses/{request_id} returns 202 pending, 200 committed terminal or 410 expired tombstone without re-execution; result retention is 30 days.
      errors: [UNAUTHORIZED, FORBIDDEN, BUDGET_EXHAUSTED, CONCURRENCY_EXHAUSTED, PRICING_UNAVAILABLE, PAYLOAD_TOO_LARGE, UPSTREAM_UNREACHABLE, UPSTREAM_TIMEOUT, USAGE_UNSETTLED, CAPTURE_FAILED]
      telemetry: Counters cover authorization, model mismatch, upstream errors, terminal streams, cancellation, usage settlement, capture failure, token expiry and budget denial; request/token/prompt/error text never become metric labels.
    InferenceStream:
      content_type: text/event-stream; UTF-8; two LF terminate each frame.
      max_event_bytes: 1048576
      sequence: First delta or usage seq is 0 and increases by one; native harness event seq is a separate domain.
      order: [zero-or-more delta, one usage, exactly one terminal, data-DONE]
      terminal: Usage commits before terminal complete; DONE without terminal is STREAM_TRUNCATED.
      fragmentation: UTF-8 fragments may split a code point; incremental decoding never emits replacement characters for valid input.
      tools: Tool fragments assemble by call id and index before tool execution; a tool response does not trigger a second inference send.
      errors: [UPSTREAM_UNREACHABLE, UPSTREAM_TIMEOUT, USAGE_UNSETTLED, CAPTURE_FAILED, STREAM_TRUNCATED, STREAM_SEQUENCE_INVALID]
      recovery: GET /v1/responses/{request_id} returns pending, committed terminal or expired tombstone without re-execution.
    BackupManifest:
      schema_version: cf.backup.v1
      fields:
        backup_id: ID
        operation_id: ID
        barrier_seq: PosInt
        authority_id: ID
        authority_checkpoint_digest: SHA
        config_generation: PosInt
        consistency_marker: '{authority_seq:PosInt,writer_watermarks:[{store_id,last_transaction,root_digest}]}'
        captured_at: Time
        validated_at: Time-or-null
        published_at: Time-or-null
        released_at: Time-or-null
        destination_ref: ID
        key_ref: SecretRef
        stores: StoreCapture-array, 1..1024
        inventory: Artifact-array, 1..1048576 sorted by path bytes
        exclusions: Exclusion-array
        retention_until: Time
        rpo_s: PosInt
        rto_s: PosInt
        revocation_snapshot_ref: EvidenceRef
        state: 'REQUESTED|FROZEN|CAPTURED|VALIDATED|PUBLISHED|RELEASED|ABORTED|INCOMPLETE'
        offhost_readback_ref: EvidenceRef-or-null
        release_receipts: ReleaseReceipt-array
        manifest_digest: SHA
        signature: Base64url64
      digest: JCS of the complete manifest with manifest_digest and signature absent; signer transcript is CF2A-BACKUP-1 plus LF plus digest hex.
      store_capture: '{store_id:ID,kind:jsonl|git|sqlite|postgres|objects|local-journal,source_revision:Text,last_transaction:Text,artifact_path:relative-path,sha256:SHA,bytes:UInt,root_digest:SHA,validated:boolean}'
      lease: 300 seconds, renewed every 60 seconds by the live coordinator under the same barrier sequence and authority fence.
      expiry: Expiry or the overall deadline marks ABORTED and retains every writer hold; only a fenced recovery decision releases holds, and PUBLISHED is never permitted afterward.
      validated: Native readers, hashes, object closure and watermarks pass while writers remain frozen.
      published: Conditional-create encrypted upload and independent off-host digest/byte readback succeed; only then may release begin.
      released: Every participant acknowledges the same post-publication release receipt.
      distinction: Local immutable capture, native validation, off-host publication and participant release are separate commit points.
    SettlementRecord:
      schema_version: settlement.v1
      fields:
        settlement_id: ID
        revision: PosInt
        round_id: ID
        report_digest: SHA
        state: 'pending|settled_success|settled_failure|superseded'
        execution_status: string
        evidence_refs: EvidenceRef-array
        postcheck_results: PostcheckResult-array
        superseded_by: ID-or-null
        error: Error-or-null
        recorded_at: Time
      invariant: Execution pass plus failed required postcheck is settled_failure, never success.
  authority_transitions:
    dispatch_grant: issued -> consumed; one use, a different delivery replay returns GRANT_REUSED, and a lost consume reply resolves by grant and Crier delivery readback before any new launch.
    certificate: old and new serials overlap for 60 seconds; old revokes only after new identity readback.
    effect: begin commits operation_id, input_digest, resource_ref and owner fence before mutation; finish requires remote readback.
    stale_owner: Every mutation rejects an older epoch with STALE_OWNER before evaluating work.
    unresolved_effect: EFFECT_UNRESOLVED blocks replacement activation and cannot be retried blindly.
    backup_expiry: active -> ABORTED on unrenewed expiry; only a fenced recovery decision releases holds.
    revocation: Current-authority revocation and offboard state survive backup restore.
  numeric_rules:
    allowance: total_budget is the round-wide worker-attempt allowance, range 0..20000 inclusive; concurrency is independent.
    reservation: remaining = allowance - consumed - reserved; compatible waves never reset it.
    charge: Reserve before launch and consume at attempt start; NEVER_ACCEPTED proof alone refunds once.
    round_deadline: persisted at admission and includes queue, launch, transfer, retries, execution and cleanup.
    attempt_deadline: min(round_deadline, attempt_started_at + attempt_wall_s).
    turn_deadline: min(attempt_deadline, turn_started_at + turn_timeout_s); max_turns independently caps count.
    timeout_example: turn_timeout_s=10 and attempt_wall_s=60 permits two 8-second calls; a whole-invocation 10-second interpretation is retired.
    typed_resources: cpu_millis, memory_bytes, max_output_bytes, concurrency, allowance and timeouts are integers with explicit units; boolean-with-budget fields are forbidden.
  terminal_settlement_matrix:
    never_accepted: {attempt: fail, phase: launch, refund: one proven never-started reservation, board_close: false}
    start_unknown: {attempt: unknown, reservation: held, quarantined: true, retry: native readback and fence required}
    clean_exit_without_durable_result: {error: UNKNOWN_RESULT, round: unknown, success: false, third_verdict: forbidden}
    death_after_result_and_evidence_fsync: {disposition: adopt original result and replay outbox only, native_relaunch: false}
    death_before_durable_evidence: {round: unknown, quarantined: true, recovery: reconcile native, board, Git and memory effects}
    definitive_execution_or_gate_failure: {attempt: fail, correction: same worker until terminal disposition or allowance/deadline exhaustion}
    definitive_publication_failure: {execution: pass, round: partial, settled_success: false}
    uncertain_commit_push_gate_or_readback: {task: unverified, round: unverified, closeout: false, inferred_commit: false}
    pending_memory_sync: {settlement: awaiting_evidence, local_work_may_continue: true, next_round: blocked}
    turn_timeout: {result: turn_timeout, attempt_may_continue: true, round_deadline: unchanged}
    attempt_wall_timeout: {result: attempt_timeout, success: false, round_may_continue: true}
    round_deadline: {result: round_deadline, new_launches: false, cleanup_and_reports_continue: true}
    postcheck_failure: {result: settled_failure, success: false, dependency_success_wakeup: false}
  evidence_classes:
    execution: WorkerResult and native result bytes establish execution only.
    mechanical_policy: Deterministic argv, exit, oracle and repository checks have independent refs and outcomes.
    model_judgment: A judge verdict is pass, fail or uncertain; uncertainty never rewrites mechanical results.
    publication: Remote OID, tree/digest and readback qualify publication; an uncertain push is unknown, not failure.
    settlement: Required postchecks consume the other classes; closeout requires published machine evidence.
    uncertain_judgment: Does not block conforming harness checks or publication when judgment is not a required closeout hook.
    uncertain_publication: Blocks closeout but leaves other check outcomes unchanged.
  telemetry:
    record:
      schema_version: factory.telemetry.v1
      fields: '{schema_version,event_id:ID,source_event_id:ID,source_seq:PosInt,module:M0..M12|manager,event_type:Enum,operation:Enum,outcome:accepted|pass|fail|refused|unknown|cancelled,reason:ID,duration_ms:UInt,observed_at:Time,identity:FactoryIdentity,measurements:{name:finite-number},error:{code:ErrorCode,retryable:boolean}|null}'
      identity: '{project_id:ID,round_id:ID|null,run_id:ID|null,wave_id:ID|null,attempt_id:ID|null,task_id:ID|null,dispatch_id:ID|null,corr_id:ID|null}'
      rule: Execution, inference and network-failure events carry every already allocated scope identity; infrastructure events use null execution fields.
      emission: A durable state-changing operation or failed health observation emits after journal fsync; successful read-only GET/scrape/status emits no state-changing event.
      missing: Unavailable observations emit null and collection_state=unavailable; they never become zero or ready.
      network_failure: Uses factory_network_failures_total with bounded peer/reason labels and retains full FactoryIdentity in the event.
    projection: '(module,source_event_id) deduplicates emission and scrape; changed bytes are TELEMETRY_CONFLICT; source and collector cursors resume after restart without counter reset.'
    intervals: Global collection is 10 seconds; an M0–M6 local 15-second scrape is independent and cannot create operations or extend freshness.
    retention: Events 90 days and counter checkpoints 400 days with the same project-scoped mTLS role, audit and access policy.
    global_series: [factory_operations_total, factory_operation_duration_seconds, factory_active, factory_pending, factory_oldest_pending_seconds, factory_available, factory_network_failures_total, factory_observation_timestamp_seconds]
    operation_labels: factory_operations_total uses exactly module, operation, outcome and project; duration uses exactly module, operation and project. Bounded peer/reason labels belong only to registered network/derived views.
    m7:
      counters: factory_operations_total{module="M7",operation="issue|verify|deliver|renew|revoke",outcome,project}
      duration: factory_operation_duration_seconds{module="M7",operation,project}
      qualification: All five operations are checked at emission and scrape with the same source event ids.
    m8_to_m12: Each module emits the same identity envelope; module-specific metrics add only registered bounded labels.
  signed_profiles:
    schema_version: cf.signed-profile.v1
    fields: {profile_id: ID, generation: PosInt, payload_digest: SHA, signature_ref: string, defaults: object}
    controls: [receipt authority and trust, invocation lifecycle, gate policy, execution artifact, exact inference routes, global timeout, sandbox]
    binding: Secret references resolve locally and are redacted; signed payload and generation precede activation.
    precedence: accepted generation field -> signed project/lane profile -> signed deployment profile -> global fail-closed default; an explicit empty value never falls through.
    error: Unknown generation or signature refuses with CONFIG_VERSION_CONFLICT or UNSUPPORTED_VERSION.
  containment:
    credential_transport: owner-only file descriptor or mode-0600 atomic file; environment and argv are forbidden.
    staging: temporary file in the destination filesystem, fsync, mode check, atomic rename, directory fsync.
    fanout: Children do not inherit secrets unless a registered attenuated grant explicitly allows it.
    backend: Only registered containment backends launch; an unavailable backend returns EXECUTION_BACKEND_UNSUPPORTED.
    lifecycle: No-parent and backend-lifecycle semantics are explicit and cannot be assumed across backends.
  decision_slots:
    A-SUPERVISOR-PROFILE:
      owner: factory owner
      options: {resident-supervisor-v1: JCS-line control socket and cf.native.v1 adapters under separate role UIDs, successor-v2: new approved schema and vectors}
      default: resident-supervisor-v1
      fail_closed: cf.supervisor.v1, submit.sock, submit/status/cancel/drain/resume verbs, fd-3/fd-4 channels and unsealed credentials refuse activation.
    A-EXECUTION-PROFILE:
      owner: factory owner
      options: {resident-v1: canonical scheduler/foreman/supervisor protocol, successor-v2: new approved profile and vectors}
      default: resident-v1
      fail_closed: Unregistered aliases and mixed legacy profiles refuse UNSUPPORTED_VERSION.
    A-CRIER-CUSTODY-PROFILE:
      owner: factory owner
      options: {factory-ed25519-v1: body and audience bound signed custody, successor-v2: new approved enrollment and vectors}
      default: factory-ed25519-v1
      fail_closed: Legacy unsigned or audience-free requests refuse admission.
    A-BOARD-AUTHORITY:
      owner: factory owner
      options: {protected-receive-pack-cas: Git protected CAS, broker-only-repository-service: identical transaction through a repository service}
      default: protected-receive-pack-cas
      fail_closed: Unsupported forge or unchecked merge returns BOARD_CAS_UNSUPPORTED before launch.
    A-MEMORY-DIGEST:
      owner: factory owner
      options: {whole-record-v1: complete record excluding payload_digest, successor-v2: new version and migration vectors}
      default: whole-record-v1
      fail_closed: Body-only or compatibility hashes are not accepted as the same version.
    A-INFERENCE-PROFILE:
      owner: factory owner
      options: {m12-closed-v1: M12 request and seq-zero SSE grammar, successor-v2: new approved client and proxy profile}
      default: m12-closed-v1
      fail_closed: Seq-one streams and arbitrary provider options refuse activation.
    A-BACKUP-EXPIRY:
      owner: factory owner
      options: {abort-and-hold: ABORTED with writers fenced, successor-v2: new approved recovery proof}
      default: abort-and-hold
      fail_closed: Expiry never releases writers or certifies a partial backup.
    A-HA:
      owner: factory owner
      options: {single-writer-independent-authority: one manager writer and an operator-owned authority in another failure domain, quorum-controller: separately specified and qualified quorum design}
      default: single-writer-independent-authority
      fail_closed: Automatic multi-controller failover is unsupported; missing placement refuses replacement.
    B-BOARD:
      owner: factory owner
      options: {refuse: deployment remains unready, boardctl-qualified-adapter: pinned artifact with identical schema and CAS vectors}
      default: refuse
      fail_closed: An unqualified board artifact refuses dependent execution.
    C-ARTIFACT:
      owner: factory owner
      options: {refuse: inference remains unverified, qualified-package: pinned maintained package with deployment evidence}
      default: refuse
      fail_closed: A version string or workstation process is not deployment evidence.
    C-BACKUP:
      owner: factory owner
      options: {refuse: abort incomplete backup, partial: name every missing store and loss window without readiness certification}
      default: refuse
      fail_closed: Missing stores or acknowledgements abort the complete backup.
    C-LOST-AUTHORITY:
      owner: factory owner
      options: {refuse: no automatic failover, revoke-all-new-authority: complete fenced credential revocation and re-enrollment after every effect reconciles}
      default: refuse
      fail_closed: Unresolved effects block replacement activation.
  durability:
    round: Scheduler durable round precedes delivery; custody durable queue precedes accepted.
    launch: Durable launch and exclusive job directory precede start permit; consumed permit without proof is quarantined.
    board: Protected CAS plus remote readback precedes native start; row without matching event is PARTIAL_WRITE.
    result: Worker result, usage and evidence commit before their success responses.
    memory: Local fsync acknowledges local work; only remote digest readback qualifies synchronization.
    backup: Off-host digest and byte readback precede release; local capture alone is not durable backup.
  runtime_conformance:
    status: NOT ASSESSED / NOT RUN
    fixture_source: docs/handbook/contract-vectors.json
    required: [SC-01, SC-02, SC-03, SC-04, SC-05, SC-06, SC-07, SC-08, SC-09]
    rule: Fixture validation does not promote an adapter or deployment to live PROVEN.
