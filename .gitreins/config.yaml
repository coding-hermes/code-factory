# ── Global defaults (overrides engine.config.GitReinsDefaults) ─────
defaults:
  # 131,072 is engine/config.py's floor ("safe below most provider caps") and it
  # starved the CF-412 re-judge: run 34.3 iterations, 603,516 in / 140,123 out,
  # "Output token budget (131k) exceeded (140k used)", 0 of 2 criteria graded,
  # Tier 1 PASS (2026-11-10). Raised one rung per the cap-sizing rule
  # (GITREINS_MAX_ITERATIONS did not bind — the iteration count, 34.3 of 100, was
  # nowhere near its cap), so the output budget is the rung that has to move:
  # 400k gives ~2.8x the measured burn. Simplifying the criteria is the wrong
  # lever — they name the acceptance the row is graded on.
  max_output_tokens: "400k"
guards:
  secrets: true
  lint: true
  tests: true
  test_mode: full
  # The suite runs the whole selftest (~4-5 min on this host, longer under load). The default 180s
  # cap made the guard fail by TIMEOUT rather than by verdict — CF-217, measured 2026-11-05.
  test_timeout: 900
  # Must stay ABOVE test_timeout: a hook cut off mid-suite reports a fail-open PASS (measured warning).
  hook_timeout: 1200
  test_command: bash tests/selftest.sh
  lint_command: bash -n $(git ls-files "*.sh")
  # CF-031: the lint lane picks its scope from staged file EXTENSIONS and grades
  # only *.py (engine/guard_manager.py:2823); lint_command above is never read by
  # that lane. On this shell repo a commit staging no Python file therefore comes
  # back as lint=skipped, Tier 1 is a DEGRADED PASS, and allow_skips: false turned
  # that skip into exit 2 from the hook, so every docs/shell/board commit was
  # refused while the run printed green. allow_skips: true accepts only a run where
  # a gate had nothing to grade; a gate that FAILS still exits 1 and still blocks.
  # Shell syntax is graded on every commit by the tests lane (selftest section 1).
  allow_skips: true
evaluator:
  # 15 was gitreins init's default and starved the first real multi-part Tier-2 judge on this
  # repo (`Iteration cap (15) reached (15.9 used)` -> INCOMPLETE, tier1 PASS, run 74fe8232).
  # Raised one rung per the cap-sizing rule; no pipeline.stages[] pin exists, so this is the
  # effective value (MIN(stage, evaluator) collapses to it).
  #
  # 40 starved twice on CF-159 (2026-11-04): two runs bound to 8b81369 ended INCOMPLETE with
  # "Partial verdict — evaluation hit resource cap before all criteria verified" and no
  # cap-named line, elapsed ~2-3 min (well under max_time), tier1 PASS, every merits item it
  # DID grade positive; the only unverified item was the final "run tests/selftest.sh" leg.
  # Measured tier-2 input tokens at this cap: 515,807 (run b6c85e4e) and 1,197,393 (run
  # 606d010f) over 40 iterations = 13k-30k tokens/iteration burn, so the binding rung is
  # iteration count, not the time or input-token budget. Raised one rung (40 -> 100).
  # 100 bound twice on 2026-11-12 while grading one docs/board criterion on this repo, and
  # both times the criterion was the thing that lost, not the code:
  #   run a1481cc6 (7d110b1b) — verdict reached at 31.7 iterations (415,453 in) but the run
  #     kept exploring to 100.1 before it could report FAIL on two counts it had falsified;
  #   run 16932ace (284417cb) — 100.2 iterations, 4,806,540 in / 8,575 out, and the single
  #     criterion came back "Not examined — evaluation ended before this criterion was
  #     reached", so 0 of 1 graded and an INCOMPLETE that says nothing about the diff.
  # The judge re-derives every quoted number from the instruments (selftest, board_drift,
  # boardctl, board_evidence_check, cf181 sweep, P5G-01 re-probe), so ~48k input tokens per
  # iteration is the price of one full pass. Raised one rung (100 -> 200) per the cap-sizing
  # rule so a full pass fits inside the budget instead of being cut off after it.
  # 200 bound again on 2026-11-12 (CF-424): run 19049a4f spent 200.7 iterations and
  # 9,037,091 input tokens for 68 output tokens, ended with "0 of 1 criteria graded, 1
  # ungraded" — the criterion was never examined, so the FAIL says nothing about the diff.
  # ~45k input/iteration holds, so the binding rung is still iteration count. Raised one
  # rung (200 -> 400) per the cap-sizing rule.
  # 400 bound twice on 2026-11-13 (P5G-10), again grading ONE docs criterion:
  #   run f7bc6f9b / 4d0b4388 — "Iteration cap (400) reached (400.4 used)", 0 of 1
  #     criteria graded, 2,985,128 in / 7,843 out.
  #   run 186b3284 — same shape, 400.1 used, 4,318,343 in / 8,569 out, criterion
  #     UNVERIFIED ("not examined"). A per-call max_iterations=800 override was
  #     accepted by the job record but did NOT bind the evaluator (it still cut at
  #     400), so the config value is the only effective knob on this install.
  # Two starvations of a single-criterion task at the same rung license one raise;
  # input budget is nowhere near binding (4.3M at 400 iterations), so raise the
  # iteration rung one more step (400 -> 800) rather than splitting the criterion.
  # ⚠ PROBE RESULT (job-2ef71d1edcf148bba7bc017f864aa913, clean detached worktree of
  # 76839918): at 800 the run reached 716.3 iterations and then died on
  # "Input token budget (10.0M) exceeded (10.1M used)" — 10,070,101 in / 19,714 out,
  # again 0 of 1 criteria graded with the criterion UNVERIFIED. So the rung is NOT
  # settled: iteration headroom was still available and the input budget became the
  # binding cap (~14k in/iteration measured). Four runs, four different binding
  # budgets, zero criteria graded — the evaluator is not converging on this task, so
  # the fix is NOT another rung. Filed as CF-426 (shrink the judged evidence scope for
  # docs-only rows, or name the code path that never reaches the criterion).
  #
  # ── CF-426 resolution (2026-11-25) ──
  # Code path named: engine/evaluator.py::_evaluate_loop. Criterion grading is
  # entirely model-driven — nothing in the loop allocates budget per criterion or
  # forces a grading checkpoint, so a judge that re-derives evidence every pass can
  # burn its whole budget before it ever emits the verdict JSON. The dedup hint is
  # a warning, not a bound: it fires only on an EXACT repeat (run_command keyed on
  # the exact cmd string, read_file on the path, search_pattern on the regex —
  # _execute_tool_with_dedup), so varying one argument re-bills the pass. Every
  # turn re-sends the whole transcript, so input grows superlinearly with
  # exploration; compaction (max 3, threshold 90% of the input budget) resets the
  # iteration counter AND token tracking, so whichever budget is reached first
  # between compactions binds — that is why the rungs above died on four different
  # budgets with the same 0-of-1 shape.
  #
  # Fixture reproduction (scripts/probe_cf426_tier2_bounded_docs.py, engine 0.22.0
  # from the ~/gitreins local build, mock judge driving the real loop/tools; the
  # stored measurement is docs/audits/cf426-tier2-probe-evidence.json, which
  # records the measured head per arm — re-run it to reproduce):
  #   - UNBOUNDED arm — P5G-10's original single-blob criterion plus a
  #     re-deriving judge reproduces the starved verdict shape exactly:
  #     "Cap exceeded: Iteration cap (100) reached (100.1 used)", 0 of 1 criteria
  #     graded, criterion UNVERIFIED "Not examined — evaluation ended before this
  #     criterion was reached", 1,104,674 estimated in / 2,640 out.
  #   - BOUNDED arm — the same engine grades a one-criterion docs task 1 of 1
  #     PASS (verdict COMPLETE) at 6.5 iterations / 28,534 estimated in / 254 out
  #     (deterministic across runs). Token figures are transcript-derived
  #     estimates (chars/3.5, the engine's own _estimate_context_tokens fallback;
  #     the starved arm's per-turn burn modelled at the measured ~14k/turn of
  #     job-2ef71d1e) — labelled estimates, not provider-billed numbers.
  #
  # MEASURED BOUNDED EVIDENCE SCOPE for docs-only rows (real verdicts on this
  # repo, disk-checked): verdict 2de7f84b — P5G-10 merits re-judge, tier2 PASS,
  # 1/1 criteria graded, bound to 25cf3a8f; its criterion is a PROOF recipe that
  # names exact headings and fields and reads only M4-board.md +
  # contract-vectors.json. Verdict 402cc1f4 — one-criterion docs/shell row, tier2
  # PASS 1/1; its PROOF is two grep/awk commands with expected outputs. Verdict
  # 7f326496 — 4/4 graded after one-AC-per-criterion (the CF-521 coverage-gate
  # lesson). The recipe: ONE AC per criterion; the criterion text itself carries
  # the PROOF recipe (exact files + headings + commands + expected outputs + a
  # FAILIF clause); grade the committed tree only — say so in the criterion
  # ("do not re-run tests/selftest.sh, do not rebuild the handbook") — and cite
  # pre-computed gate artifacts instead of re-deriving them. Per-verdict token
  # attribution from .gitreins/usage.jsonl is NOT derivable (one tier2 row per
  # pipeline step; on shared evenings the row→verdict mapping is ambiguous), so
  # judged scope is measured in iterations here and capped-run burn is quoted
  # from the verdict summaries' own "The run spent …" lines.
  #
  # ── CF-544 interaction (2026-11-26) — exemplar criterion freshness ──
  # Implementation 4c192f78 (closed by cc332291) re-literal'd the claim ordering
  # rule: M4 §15.2 and the CV-04 vectors now carry "created_seq ASC, id ASC;
  # dependencies must be settled; correction retains its original worker" with
  # priority excluded — 'priority DESC' no longer appears in
  # contract-vectors.json (grep count 0 at e7ffed76). Verdict 2de7f84b above is
  # disk-true as a VERDICT, but its criterion clause (c) quotes the RETIRED
  # "priority DESC, created_seq ASC, id ASC" string, so a fresh same-tree
  # rejudge reusing that criterion verbatim will FAIL (c) against this tree.
  # The CF-426 AC3 fresh P5G-10 merits rejudge must re-author clause (c) to the
  # current literal; clauses (a), (b), (d), (e) still hold (CLAIM_CONFLICT 409
  # remains at M4-board.md:750). The other bounded exemplars re-verified live
  # at e7ffed76: 402cc1f4's proof commands still reproduce (no duplicate
  # section numbers, 76=76; cf198 mapping arms_plan=80 arms_tree=80, RESULT:
  # OK), and the probe evidence (docs/audits/cf426-tier2-probe-evidence.json)
  # was re-run at this tip — CF426_PROBE_PASS (COMPLETE, 1/1, 6.5 iterations /
  # ~28k estimated in) and CF426_STARVE_REPRODUCED (0/1 graded, 100.1
  # iterations / ~1.10M estimated in).
  #
  # ── P5G-35 (2026-11-28) — bound the poll loop, not the budget ──
  # The ladder above stops at 800 deliberately: the 800 rung died on the input
  # budget at 716.3 iterations with 0 of 1 graded, so raising it again is
  # measured NOT to converge. scripts/probe_p5g35_tier2_poll_bound.py
  # (regression: tests/test_p5g35_tier2_iteration_cap.py; measurement:
  # docs/audits/p5g35-tier2-evidence.json) drives the real evaluator loop with
  # scripted judges and measures the failure and the remedies:
  #   - WHY the rungs die: a sleep-0 poll loop is ~980 iterations per second
  #     of wall clock (red-proof arm: max_time pinned 1s + max_iterations
  #     1000000 → "Cap exceeded: Time cap (1s) exceeded (1s elapsed)" after
  #     977.8 iterations / 888 sleep/grep poll calls), so any iteration rung
  #     is consumed in seconds while the whole transcript is re-sent every
  #     turn — the input budget takes the hit, which is exactly the job-2ef71d1e
  #     shape (716.3 iterations, 10.07M in, 0 of 1 graded).
  #   - The dedup hint is not a bound (measured): the starved arm's
  #     varied-argument poller logged 3 _dedup_warning markers (exact repeats
  #     interleaved) and STILL burned 8.7/8 iterations with 0 of 1 criteria
  #     graded and the criterion UNVERIFIED "Not examined — evaluation ended
  #     before this criterion was reached". Its literal cap line:
  #     "Cap exceeded: Iteration cap (8) reached (8.7 used)"; wall clock
  #     0.38s against max_time 30m and 40 output tokens against 1m — neither
  #     of those rungs bound; the iteration rung did.
  #   - The remedy THIS repo owns is the read-once bounded evidence recipe
  #     (verdicts 2de7f84b, 402cc1f4, 7f326496 above): the bounded arm grades
  #     1 of 1 EXAMINED (PASS with a detail naming the log's decisive lines)
  #     at 4.3 iterations with 1 log read and 0 poll calls, inside the same
  #     cap that starved the poller. Authors of one-criterion rows: the
  #     criterion text itself must carry the read-once PROOF recipe and forbid
  #     polling and re-derivation.
  #   - A structural per-tool poll cap would live in the gitreins engine
  #     (engine/evaluator.py::_evaluate_loop is model-driven; that seam is
  #     gitreins-repo work, not code-factory). Until it exists, keep
  #     max_iterations here and grade single-criterion rows via read-once
  #     recipes, recording the run's poll count beside the cap it used.
  max_iterations: 800
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096
resolution:
  enabled:
    cli: false
    mcp: false
    predispatch: false
    judge_prescreen: false
  model: typesafe/jev-1.13
  tokens_max: 28000
  bands:
    resolved_at: 0.85
    review_at: 0.5
  egress_exclude: []
