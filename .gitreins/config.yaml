# ── Global defaults (overrides engine.config.GitReinsDefaults) ─────
defaults:
  # 131,072 is engine/config.py's floor ("safe below most provider caps") and it
  # starved the CF-412 re-judge: run 34.3 iterations, 603,516 in / 140,123 out,
  # "Output token budget (131k) exceeded (140k used)", 0 of 2 criteria graded,
  # Tier 1 PASS (2026-11-10). Raised one rung per the cap-sizing rule
  # (GITREINS_MAX_ITERATIONS did not bind — the iteration count, 34.3 of 100, was
  # nowhere near its cap), so the output budget is the rung that has to move:
  # 400k gives ~2.8x the measured burn. Simplifying the criteria is the wrong
  # lever — they name the acceptance the row is graded on.
  max_output_tokens: "400k"
guards:
  secrets: true
  lint: true
  tests: true
  test_mode: full
  # The suite runs the whole selftest (~4-5 min on this host, longer under load). The default 180s
  # cap made the guard fail by TIMEOUT rather than by verdict — CF-217, measured 2026-11-05.
  test_timeout: 900
  # Must stay ABOVE test_timeout: a hook cut off mid-suite reports a fail-open PASS (measured warning).
  hook_timeout: 1200
  test_command: bash tests/selftest.sh
  lint_command: bash -n $(git ls-files "*.sh")
  # CF-031: the lint lane picks its scope from staged file EXTENSIONS and grades
  # only *.py (engine/guard_manager.py:2823); lint_command above is never read by
  # that lane. On this shell repo a commit staging no Python file therefore comes
  # back as lint=skipped, Tier 1 is a DEGRADED PASS, and allow_skips: false turned
  # that skip into exit 2 from the hook, so every docs/shell/board commit was
  # refused while the run printed green. allow_skips: true accepts only a run where
  # a gate had nothing to grade; a gate that FAILS still exits 1 and still blocks.
  # Shell syntax is graded on every commit by the tests lane (selftest section 1).
  allow_skips: true
evaluator:
  # 15 was gitreins init's default and starved the first real multi-part Tier-2 judge on this
  # repo (`Iteration cap (15) reached (15.9 used)` -> INCOMPLETE, tier1 PASS, run 74fe8232).
  # Raised one rung per the cap-sizing rule; no pipeline.stages[] pin exists, so this is the
  # effective value (MIN(stage, evaluator) collapses to it).
  #
  # 40 starved twice on CF-159 (2026-11-04): two runs bound to 8b81369 ended INCOMPLETE with
  # "Partial verdict — evaluation hit resource cap before all criteria verified" and no
  # cap-named line, elapsed ~2-3 min (well under max_time), tier1 PASS, every merits item it
  # DID grade positive; the only unverified item was the final "run tests/selftest.sh" leg.
  # Measured tier-2 input tokens at this cap: 515,807 (run b6c85e4e) and 1,197,393 (run
  # 606d010f) over 40 iterations = 13k-30k tokens/iteration burn, so the binding rung is
  # iteration count, not the time or input-token budget. Raised one rung (40 -> 100).
  # 100 bound twice on 2026-11-12 while grading one docs/board criterion on this repo, and
  # both times the criterion was the thing that lost, not the code:
  #   run a1481cc6 (7d110b1b) — verdict reached at 31.7 iterations (415,453 in) but the run
  #     kept exploring to 100.1 before it could report FAIL on two counts it had falsified;
  #   run 16932ace (284417cb) — 100.2 iterations, 4,806,540 in / 8,575 out, and the single
  #     criterion came back "Not examined — evaluation ended before this criterion was
  #     reached", so 0 of 1 graded and an INCOMPLETE that says nothing about the diff.
  # The judge re-derives every quoted number from the instruments (selftest, board_drift,
  # boardctl, board_evidence_check, cf181 sweep, P5G-01 re-probe), so ~48k input tokens per
  # iteration is the price of one full pass. Raised one rung (100 -> 200) per the cap-sizing
  # rule so a full pass fits inside the budget instead of being cut off after it.
  # 200 bound again on 2026-11-12 (CF-424): run 19049a4f spent 200.7 iterations and
  # 9,037,091 input tokens for 68 output tokens, ended with "0 of 1 criteria graded, 1
  # ungraded" — the criterion was never examined, so the FAIL says nothing about the diff.
  # ~45k input/iteration holds, so the binding rung is still iteration count. Raised one
  # rung (200 -> 400) per the cap-sizing rule.
  max_iterations: 400
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096
resolution:
  enabled:
    cli: false
    mcp: false
    predispatch: false
    judge_prescreen: false
  model: typesafe/jev-1.13
  tokens_max: 28000
  bands:
    resolved_at: 0.85
    review_at: 0.5
  egress_exclude: []
