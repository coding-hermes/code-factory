guards:
  secrets: true
  lint: true
  tests: true
  test_mode: full
  # The suite runs the whole selftest (~4-5 min on this host, longer under load). The default 180s
  # cap made the guard fail by TIMEOUT rather than by verdict — CF-217, measured 2026-11-05.
  test_timeout: 900
  test_command: bash tests/selftest.sh
  lint_command: bash -n $(git ls-files "*.sh")
  # CF-031: the lint lane picks its scope from staged file EXTENSIONS and grades
  # only *.py (engine/guard_manager.py:2823); lint_command above is never read by
  # that lane. On this shell repo a commit staging no Python file therefore comes
  # back as lint=skipped, Tier 1 is a DEGRADED PASS, and allow_skips: false turned
  # that skip into exit 2 from the hook, so every docs/shell/board commit was
  # refused while the run printed green. allow_skips: true accepts only a run where
  # a gate had nothing to grade; a gate that FAILS still exits 1 and still blocks.
  # Shell syntax is graded on every commit by the tests lane (selftest section 1).
  allow_skips: true
evaluator:
  # 15 was gitreins init's default and starved the first real multi-part Tier-2 judge on this
  # repo (`Iteration cap (15) reached (15.9 used)` -> INCOMPLETE, tier1 PASS, run 74fe8232).
  # Raised one rung per the cap-sizing rule; no pipeline.stages[] pin exists, so this is the
  # effective value (MIN(stage, evaluator) collapses to it).
  #
  # 40 starved twice on CF-159 (2026-11-04): two runs bound to 8b81369 ended INCOMPLETE with
  # "Partial verdict — evaluation hit resource cap before all criteria verified" and no
  # cap-named line, elapsed ~2-3 min (well under max_time), tier1 PASS, every merits item it
  # DID grade positive; the only unverified item was the final "run tests/selftest.sh" leg.
  # Measured tier-2 input tokens at this cap: 515,807 (run b6c85e4e) and 1,197,393 (run
  # 606d010f) over 40 iterations = 13k-30k tokens/iteration burn, so the binding rung is
  # iteration count, not the time or input-token budget. Raised one rung (40 -> 100).
  max_iterations: 100
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096
resolution:
  enabled:
    cli: false
    mcp: false
    predispatch: false
    judge_prescreen: false
  model: typesafe/jev-1.13
  tokens_max: 28000
  bands:
    resolved_at: 0.85
    review_at: 0.5
  egress_exclude: []
